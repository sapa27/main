            return rows.find(r=>r&&(r.isPersonnelCompensation===true||/ค่าตอบแทนผู้ปฏิบัติงาน|ผู้ปฏิบัติงานให้คณะกรรมาธิการ/.test(String(r.item||r.name||r.label||r.type||r.entryType||''))))||{};
          }
          function spent(row){
            const keys=['personnelExpense','staffExpense','ytdExpense','salaryExpense','compensationExpense','allowanceExpense','currentMonthlyExpense','monthlyRateTotal','totalPaid','totalSpent','spent','spentAmount','expense','expenseAmount','amount','totalAmount'];
            for(const k of keys){if(row&&row[k]!=null&&String(row[k]).trim()!==''){const n=num(row[k]);if(n>0)return n}}
            return 0;
          }
          const people=body('p7bPeople'),def=body('p7bBudgetDefault'),fresh=body('p7bBudgetFresh');
          const defaultPeopleOuter=JSON.parse(fs.readFileSync(path.join(process.env.P7B_DIR,'apiGetPeoplePageBundle.body.json'),'utf8'));
          const defaultPeopleResult=defaultPeopleOuter?.result;
          const defaultPeople=defaultPeopleResult&&defaultPeopleResult.data&&typeof defaultPeopleResult.data==='object'?defaultPeopleResult.data:defaultPeopleResult||{};
          const peopleMonthly=num(people.currentMonthlyExpense||people.summary?.currentMonthlyExpense||people.salarySummary?.currentMonthlyExpense);
          const peopleDefaultMonthly=num(defaultPeople.currentMonthlyExpense||defaultPeople.summary?.currentMonthlyExpense||defaultPeople.salarySummary?.currentMonthlyExpense);
          function personnelRows(data){
            const rows=[...(Array.isArray(data.rows)?data.rows:[]),...(Array.isArray(data.items)?data.items:[])];
            return rows.filter(r=>r&&(r.isPersonnelCompensation===true||/ค่าตอบแทนผู้ปฏิบัติงาน|ผู้ปฏิบัติงานให้คณะกรรมาธิการ/.test(String(r.item||r.name||r.label||r.type||r.entryType||''))));
          }
          function compactFields(r){
            const out={};
            ['personnelExpense','staffExpense','ytdExpense','salaryExpense','compensationExpense','allowanceExpense','currentMonthlyExpense','monthlyRateTotal','totalPaid','totalSpent','spent','spentAmount','expense','expenseAmount','amount','totalAmount','annualCommitment','budget','remain'].forEach(k=>{
              if(r&&r[k]!=null&&String(r[k]).trim()!=='') out[k]=num(r[k]);
            });
            out.source=String(r&&r.__budgetPersonnelExpenseSource||'');
            out.contract=String(r&&r.__budgetPersonnelExpenseContract||'');
            return out;
          }
          const defDirect=compactFields(personnelRow(def)),freshDirect=compactFields(personnelRow(fresh));
          const defRows=personnelRows(def).map(compactFields),freshRows=personnelRows(fresh).map(compactFields);
          console.log('P7-B budget/personnel aggregates: '+JSON.stringify({fy:'2570',peopleDefaultMonthly,peopleSalaryMonthly:peopleMonthly,budgetDefaultDirect:defDirect,budgetDefaultRows:defRows,budgetFreshDirect:freshDirect,budgetFreshRows:freshRows}));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'\n### P7-B Budget / Personnel Aggregate Diagnostic\n- FY 2570 People current-month expense (default bundle): '+peopleDefaultMonthly.toFixed(2)+'\n- FY 2570 People current-month expense (salary bundle): '+peopleMonthly.toFixed(2)+'\n- Budget personnel display-row count (default/forceFresh): '+defRows.length+'/'+freshRows.length+'\n- Budget personnel direct amount (default/forceFresh): '+spent(personnelRow(def)).toFixed(2)+'/'+spent(personnelRow(fresh)).toFixed(2)+'\n');
          NODE

            echo "### P7 Read Data Pipeline Gate" >> "$GITHUB_STEP_SUMMARY"
            echo "- Dashboard read: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- Case search read: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- Committee meeting read: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- Tracking read: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- People read: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- Petitioner read: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- Budget summary read: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- Public edge → Cloud Run → GAS read contract: PASS" >> "$GITHUB_STEP_SUMMARY"

            AUTH_SESSION_REQ="$auth_dir/session.request.json" P2_EDGE_ORIGIN="$edge_origin" node <<'NODE_SUBCOMMITTEE'
          const fs = require('fs');
          const assert = require('node:assert/strict');
          (async function () {
          const auth = JSON.parse(fs.readFileSync(process.env.AUTH_SESSION_REQ, 'utf8')).payload;
          const origin = process.env.P2_EDGE_ORIGIN;
          async function call(method, payload) {
            const response = await fetch(origin + '/api/router', {
              method: 'POST', headers: {'Content-Type':'application/json', Origin:origin},
              body: JSON.stringify({method:'apiRouter', payload:{method, payload:{...auth,...payload}}, timeoutMs:90000}),
              signal: AbortSignal.timeout(100000)
            });
            assert.equal(response.status, 200, 'SUBCOMMITTEE_HTTP_FAILED');
            const body = await response.json();
            assert.equal(body.transportOk, true, 'SUBCOMMITTEE_TRANSPORT_FAILED');
            const result = body.result || body;
            console.log('Subcommittee request '+method+': '+JSON.stringify({applicationOk:result.ok!==false,rowCount:rows(result).length}));
            assert.notEqual(result.ok, false, 'SUBCOMMITTEE_APPLICATION_FAILED');
            return result;
          }
          function rows(value) {
            if (Array.isArray(value)) return value;
            if (!value || typeof value !== 'object') return [];
            for (const key of ['rows','items','records','list','data','result']) if (value[key]) return rows(value[key]);
            return [];
          }
          const base = {reportType:'status', reportValue:'อนุฯ พิจารณา', forceFresh:true, noCache:true, maxRows:5000, includeMeetingHistory:false};
          const all = rows(await call('apiGetCaseReportExportRows', base));
          assert.ok(all.every(row => Object.hasOwn(row,'subcommitteeName')), 'SUBCOMMITTEE_READ_FIELD_MISSING');
          const options = rows(await call('apiBudgetGetSubcommitteeOptions', {limit:500}));
          const named = all.find(row => String(row.subcommitteeName || '').trim());
          const option = options[0];
          const name = named ? String(named.subcommitteeName).trim() : String(typeof option === 'string' ? option : option && (option.subcommitteeName || option.name || option.committeeName || option.title || option.groupName || option['ชื่อคณะอนุกรรมาธิการ'] || option['คณะอนุกรรมาธิการ'] || option['ชื่อคณะ'] || option['ชื่อ']) || '').trim();
          assert.ok(name, 'SUBCOMMITTEE_OPTIONS_EMPTY');
          const expected = all.filter(row => String(row.subcommitteeName || '').trim() === name);
          const selected = {...base, subcommitteeName:name};
          const exported = rows(await call('apiGetCaseReportExportRows', selected));
          assert.equal(exported.length, expected.length, 'SUBCOMMITTEE_EXPORT_COUNT_MISMATCH');
          assert.ok(exported.every(row => String(row.subcommitteeName || '').trim() === name), 'SUBCOMMITTEE_EXPORT_LEAK');
          const cachedPayload = {...selected,forceFresh:false,noCache:false,bypassCache:false,page:1,limit:20,pageSize:20,compactReadModel:true};
          const filtered = await call('apiSearchCasesLite', cachedPayload);
          const items = rows(filtered);
          assert.ok(items.every(row => String(row.subcommitteeName || '').trim() === name), 'SUBCOMMITTEE_PAGE_LEAK');
          assert.equal(items.length, Math.min(20,expected.length), 'SUBCOMMITTEE_PAGE_COUNT_MISMATCH');
          const total = Number(filtered.totalRecords ?? filtered.total ?? filtered.data?.totalRecords ?? filtered.data?.total);
          assert.equal(total, expected.length, 'SUBCOMMITTEE_TOTAL_MISMATCH');
          const unfiltered = await call('apiSearchCasesLite', {...cachedPayload,subcommitteeName:''});
          assert.equal(rows(unfiltered).length, Math.min(20,all.length), 'SUBCOMMITTEE_CLEAR_FILTER_FAILED');
          const repeated = await call('apiSearchCasesLite',cachedPayload);
          assert.deepEqual(rows(repeated).map(r=>r.caseId || r.id),items.map(r=>r.caseId || r.id),'SUBCOMMITTEE_CACHE_COLLISION');
          console.log('Case subcommittee read gate: PASS '+JSON.stringify({statusRows:all.length,selectedRows:expected.length,pageRows:items.length,exportRows:exported.length,cacheIsolation:true}));
          })().catch(error => { console.error('SUBCOMMITTEE_READ_GATE_FAILED: '+String((String(error.message || '').match(/SUBCOMMITTEE_[A-Z_]+/) || [])[0] || error.code || 'UNKNOWN')); process.exitCode = 1; });
          NODE_SUBCOMMITTEE

            rm -rf "$auth_dir"
            echo "P2 auth smoke: PASS"
            echo "P3 login/session/Dashboard contract: PASS"
            echo "- Authenticated apiLogin → apiSessionCheck: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "### P3 Login / Session / Dashboard Boot Contract Gate" >> "$GITHUB_STEP_SUMMARY"
            echo "- apiLogin contract: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- apiSessionCheck contract: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- Scripts_Page_Dashboard static Cloud Run controller fetch: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- apiGetDashboardBundle authenticated data fetch: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "### P11 Production Deployment Quality Gate" >> "$GITHUB_STEP_SUMMARY"
            echo "- Required Cloudflare credentials: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- Required authenticated E2E credentials: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- Login → session → Dashboard → P7 reads: PASS" >> "$GITHUB_STEP_SUMMARY"

          rm -rf "$p2_rpc_dir"

          edge_config=""
          for attempt in 1 2 3; do
            if candidate="$(curl --max-time 30 --retry 2 --retry-delay 2 --retry-all-errors -fsS "$edge_origin/app-config.js")"; then
              edge_config="$candidate"
              break
            fi
            test "$attempt" -lt 3 && sleep 2
          done
          test -n "$edge_config" || { echo "P0-F-B1 edge app-config unavailable" >&2; exit 1; }
          edge_index_tmp="$(mktemp)"
          curl --max-time 45 --retry 2 --retry-delay 2 --retry-all-errors -fsS "$edge_origin/" -o "$edge_index_tmp"
          grep -q 'dashboard-initial-data-gate-p4' "$edge_index_tmp"
          grep -q 'auth.dashboardDataReady' "$edge_index_tmp"
          grep -q 'critical-login-runtime-p4' "$edge_index_tmp"
          grep -q 'dashboard-data-recovery-p5' "$edge_index_tmp"
          grep -q 'recoveryState.reset("login-dashboard-bootstrap")' "$edge_index_tmp"
          grep -q 'rotationRetry=/SESSION_TOKEN_ROTATED_RETRY' "$edge_index_tmp"
          grep -q 'function syncAuthPayloadCrit' "$edge_index_tmp"
          grep -q 'function resetActionAuthCrit' "$edge_index_tmp"
          grep -q 'nextSessionToken' "$edge_index_tmp"
          grep -q 'nextCsrfToken' "$edge_index_tmp"
          grep -q 'app-production-measurement-gate-current' "$edge_index_tmp"
          grep -q 'RUN_PERFORMANCE_BASELINE' "$edge_index_tmp"
          grep -q 'm10-dependency-performance-baseline-r330' "$edge_index_tmp"
          grep -q '__APP_SINGLE_EVENT_DELEGATION__' "$edge_index_tmp"
          grep -q '__APP_SINGLE_CHANGE_DELEGATION__' "$edge_index_tmp"
          grep -q 'data-mobile-nav-owner' "$edge_index_tmp"
          grep -q '__APP_SIDEBAR_NAV_CLICK_OWNER__' "$edge_index_tmp"
          grep -q 'AppPrint.printWithProfile' "$edge_index_tmp"
