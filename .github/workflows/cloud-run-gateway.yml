            method:'getDeferredInclude',
            payload:{name:'Scripts_Page_Dashboard',forceFresh:true,token,_token:token,authToken:token,csrfToken:csrf,csrf,_csrf:csrf},
            timeoutMs:70000
          }));
          fs.writeFileSync(process.env.AUTH_DASHBOARD_DATA_REQ,JSON.stringify({
            method:'apiRouter',
            payload:{
              method:'apiGetDashboardBundle',
              payload:{token,sessionToken:token,csrfToken:csrf,csrf,_csrf:csrf,forceFresh:true,clientContext:{source:'github-actions-p3-dashboard',headless:true}}
            },
            timeoutMs:70000
          }));
          NODE

            session_code="$(curl --max-time 45 --retry 1 --retry-delay 2 --retry-all-errors -sS \
              -D "$auth_dir/session.headers.txt" -o "$auth_dir/session.body.json" -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -H "Origin: $edge_origin" \
              --data-binary "@$auth_dir/session.request.json" \
              "$edge_origin/api/router" || true)"
            test "$session_code" = "200" || { echo "P2 authenticated apiSessionCheck failed (HTTP $session_code)" >&2; exit 1; }

            AUTH_SESSION_BODY="$auth_dir/session.body.json" AUTH_SESSION_HEADERS="$auth_dir/session.headers.txt" P2_EDGE_ORIGIN="$edge_origin" node <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync(process.env.AUTH_SESSION_BODY,'utf8'));
          const headers=fs.readFileSync(process.env.AUTH_SESSION_HEADERS,'utf8').split(/\r?\n/);
          const get=name=>{
            const prefix=name.toLowerCase()+':';
            const line=headers.find(x=>x.toLowerCase().startsWith(prefix));
            return line?line.slice(line.indexOf(':')+1).trim():'';
          };
          if(get('x-gas-response-contract')!=='gas-direct-json-v1'||get('x-p0f-edge')!=='cloudflare-workers-dev') process.exit(1);
          if(get('access-control-allow-origin')!==process.env.P2_EDGE_ORIGIN) process.exit(1);
          if(body?.transportOk!==true||!Object.prototype.hasOwnProperty.call(body,'result')) process.exit(1);
          const result=body.result;
          if(result&&typeof result==='object'&&result.ok===false) process.exit(1);
          const candidates=[result,result?.result,result?.data,result?.data?.data].filter(x=>x&&typeof x==='object'&&!Array.isArray(x));
          const session=candidates.find(x=>x.user||x.account||x.role||x.authenticated===true||x.valid===true);
          if(!session) process.exit(1);
          NODE

            dashboard_asset_code="$(curl --max-time 85 --retry 1 --retry-delay 2 --retry-all-errors -sS \
              -D "$auth_dir/dashboard-asset.headers.txt" -o "$auth_dir/dashboard-asset.body.json" -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -H "Origin: $edge_origin" \
              --data-binary "@$auth_dir/dashboard-asset.request.json" \
              "$edge_origin/api/router" || true)"
            test "$dashboard_asset_code" = "200" || { echo "P3 Dashboard controller fetch failed (HTTP $dashboard_asset_code)" >&2; exit 1; }

            AUTH_DASHBOARD_ASSET_BODY="$auth_dir/dashboard-asset.body.json" AUTH_DASHBOARD_ASSET_HEADERS="$auth_dir/dashboard-asset.headers.txt" P3_EDGE_ORIGIN="$edge_origin" node <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync(process.env.AUTH_DASHBOARD_ASSET_BODY,'utf8'));
          const headers=fs.readFileSync(process.env.AUTH_DASHBOARD_ASSET_HEADERS,'utf8').split(/\r?\n/);
          const get=name=>{
            const prefix=name.toLowerCase()+':';
            const line=headers.find(x=>x.toLowerCase().startsWith(prefix));
            return line?line.slice(line.indexOf(':')+1).trim():'';
          };
          if(get('x-gas-response-contract')!=='gas-direct-json-v1'||get('x-p0f-edge')!=='cloudflare-workers-dev') process.exit(1);
          if(get('access-control-allow-origin')!==process.env.P3_EDGE_ORIGIN) process.exit(1);
          if(body?.transportOk!==true||!Object.prototype.hasOwnProperty.call(body,'result')) process.exit(1);
          let current=body.result,html='';
          for(let depth=0;depth<6&&current&&typeof current==='object'&&!Array.isArray(current);depth++){
