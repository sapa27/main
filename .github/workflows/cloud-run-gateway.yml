name: Cloud Run Production
on:
  push:
    paths:
      - 'cloud-run-gateway/**'
      - 'frontend/**'
      - '.github/tests/regression.mjs'
      - '.github/workflows/cloud-run-gateway.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy validated CR-8 GAS-canonical production service'
        required: true
        type: boolean
        default: false

concurrency:
  group: cloud-run-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Stage production frontend
        run: |
          set -euo pipefail
          rm -rf cloud-run-gateway/public
          cp -R frontend cloud-run-gateway/public
          test -f cloud-run-gateway/public/index.html
          test -f cloud-run-gateway/public/app-config.js
          test -f cloud-run-gateway/public/cloud-run-transport.js
          test -f cloud-run-gateway/public/meeting-controller.html
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Diagnose live Dashboard controller contract
        env:
          LIVE_ORIGIN: https://sapa27-gateway-asxuzzwspa-eu.a.run.app
        run: |
          node <<'NODE'
          const crypto=require('node:crypto');
          (async()=>{
          const base=process.env.LIVE_ORIGIN;
          async function rpc(method,payload,timeoutMs=45000){
            const r=await fetch(base+'/api/router',{
              method:'POST',
              headers:{'Content-Type':'application/json','Origin':base,'X-Request-ID':'dashboard-live-contract-diagnostic'},
              body:JSON.stringify({method,payload,timeoutMs})
            });
            const text=await r.text();
            let json=null; try{json=JSON.parse(text)}catch(_){}
            return {status:r.status,contract:r.headers.get('x-gas-response-contract')||'',requestId:r.headers.get('x-request-id')||'',json,text};
          }
          function sourceOf(v,depth=0){
            if(typeof v==='string') return v.length>100?v:'';
            if(!v||typeof v!=='object'||depth>5) return '';
            for(const k of ['html','content','source','text','value','body','data','result','payload']){
              if(Object.prototype.hasOwnProperty.call(v,k)){const hit=sourceOf(v[k],depth+1);if(hit)return hit;}
            }
            for(const k of Object.keys(v)){const hit=sourceOf(v[k],depth+1);if(hit)return hit;}
            return '';
          }
          function clip(src,needle,radius=420){
            const i=src.indexOf(needle);
            if(i<0)return '(not found)';
            return src.slice(Math.max(0,i-radius),Math.min(src.length,i+needle.length+radius)).replace(/\s+/g,' ').slice(0,1200);
          }
          for(const name of ['Scripts_Page_Dashboard','Scripts_Core_Runtime']){
            const out=await rpc('getDeferredInclude',{name,forceFresh:true,assetStamp:'live-contract-diag-20260919'});
            const result=out.json&&out.json.result;
            const src=sourceOf(result);
            console.log('DIAG_INCLUDE',JSON.stringify({
              name,status:out.status,contract:out.contract,transportOk:!!(out.json&&out.json.transportOk),
              resultType:Array.isArray(result)?'array':typeof result,
              resultKeys:result&&typeof result==='object'?Object.keys(result).slice(0,40):[],
              nestedKeys:result&&result.data&&typeof result.data==='object'?Object.keys(result.data).slice(0,40):[],
              sourceLength:src.length,sha256:src?crypto.createHash('sha256').update(src).digest('hex'):'',
              dashboardOwner:src.includes('dashboard-single-owner-production-current'),
              dashboardResponseOkGuard:src.includes('res && res.ok !== !0')||src.includes('res&&res.ok!==!0'),
              apiRunner:src.includes('AppPageKit.apiRunner'),
              preserveEnvelope:src.includes('preserveEnvelope'),
              envData:src.includes('env.data')
            }));
            if(name==='Scripts_Page_Dashboard') console.log('DIAG_DASH_GUARD',clip(src,'responseCode'));
            if(name==='Scripts_Core_Runtime') {
              console.log('DIAG_CORE_RESPONSE',clip(src,'preserveEnvelope'));
              console.log('DIAG_CORE_APIRUNNER',clip(src,'apiRunner'));
            }
          }
          const dash=await rpc('apiGetDashboardBundle',{
            forceFresh:true,noCache:true,bypassCache:true,includeBudget:true,includeCases:false,
            includeWorkflow:true,phase1FirstPaint:false,phase1LazyHydration:false,dashboardSingleCompletePath:true,
            source:'unauth-live-contract-diagnostic'
          },35000);
          const app=dash.json&&dash.json.result;
          const data=app&&typeof app==='object'?(app.data&&typeof app.data==='object'?app.data:app):{};
          console.log('DIAG_UNAUTH_DASHBOARD',JSON.stringify({
            status:dash.status,contract:dash.contract,transportOk:!!(dash.json&&dash.json.transportOk),
            appType:Array.isArray(app)?'array':typeof app,
            appOk:app&&typeof app==='object'?app.ok:null,
            appErrorCode:app&&typeof app==='object'?(app.errorCode||app.code||''):'',
            gasErrorCode:dash.json&&dash.json.error?(dash.json.error.code||dash.json.error.errorCode||''):'',
            gasMessage:dash.json&&dash.json.error?(dash.json.error.message||dash.json.error.error||''):'',
            appMessage:app&&typeof app==='object'?(app.error||app.message||app.msg||''):'',
            keys:data&&typeof data==='object'?Object.keys(data).slice(0,30):[]
          }));
          })().catch(err=>{console.error('DIAG_FATAL',err&&err.stack||err);process.exitCode=1});
          NODE
      - name: Validate CR-8 frontend and gateway
        run: |
          set -euo pipefail
          node .github/tests/regression.mjs --frontend-only
          cd cloud-run-gateway
          npm run check
          npm test
      - name: Validate container build
        run: docker build --file cloud-run-gateway/Dockerfile cloud-run-gateway

  deploy:
    needs: validate
    if: (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-cloud-run]'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'sapa27' }}
      REGION: ${{ vars.GCP_REGION || 'asia-southeast3' }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'sapa27-gateway' }}
      CANARY_SERVICE: sapa27-gateway-cr8-canary
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || 'projects/770468331446/locations/global/workloadIdentityPools/github-actions/providers/sapa27-main' }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT || 'github-cloud-run-deployer@sapa27.iam.gserviceaccount.com' }}
      GAS_WEB_APP_URL: https://script.google.com/macros/s/AKfycbz73ISkoejp_JJOPEC1OfPenrej427rA897CL_-8wsM9oMm1zM-hHUZH3NjYuIfWF-d/exec
      CLOUD_RUN_ORIGIN: https://sapa27-gateway-asxuzzwspa-eu.a.run.app
    steps:
      - uses: actions/checkout@v4
      - name: Stage production frontend
        run: |
          set -euo pipefail
          rm -rf cloud-run-gateway/public
          cp -R frontend cloud-run-gateway/public
      - name: Validate deployment variables
        run: |
          set -euo pipefail
          for name in PROJECT_ID REGION SERVICE CANARY_SERVICE WIF_PROVIDER DEPLOY_SERVICE_ACCOUNT GAS_WEB_APP_URL CLOUD_RUN_ORIGIN; do
            test -n "${!name:-}" || { echo "Missing $name" >&2; exit 1; }
          done
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy CR-8 GAS-canonical canary
        run: |
          set -euo pipefail
          gcloud run deploy "$CANARY_SERVICE"             --project "$PROJECT_ID" --region "$REGION"             --source cloud-run-gateway --allow-unauthenticated             --cpu 1 --memory 512Mi --concurrency 20             --min-instances 0 --max-instances 2 --timeout 300             --set-env-vars "GAS_WEB_APP_URL=$GAS_WEB_APP_URL,GATEWAY_ALLOWED_ORIGINS=$CLOUD_RUN_ORIGIN,APP_SOURCE_SHA=$GITHUB_SHA"
          canary_url="$(gcloud run services describe "$CANARY_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          echo "CANARY_URL=$canary_url" >> "$GITHUB_ENV"

      - name: Require direct GAS transport on canary
        run: |
          set -euo pipefail
          ready="$(curl --max-time 30 -fsS "$CANARY_URL/ready")"
          version="$(curl --max-time 30 -fsS "$CANARY_URL/version")"
          health="$(curl --max-time 30 -fsS "$CANARY_URL/health")"
          upstream=""
          for attempt in 1 2 3; do
            if candidate="$(curl --max-time 45 -fsS "$CANARY_URL/upstream-health")"; then
              upstream="$candidate"
              break
            fi
            test "$attempt" -lt 3 && sleep 4
          done
          test -n "$upstream" || { echo "Canary upstream health failed after 3 attempts" >&2; exit 1; }
          echo "Canary ready: $ready"
          echo "Canary version: $version"
          echo "Canary health: $health"
          echo "Canary upstream: $upstream"
          node -e 'const r=JSON.parse(process.argv[1]),v=JSON.parse(process.argv[2]),h=JSON.parse(process.argv[3]),u=JSON.parse(process.argv[4]),sha=process.argv[5];if(r.gateway!=="cr8-gas-canonical-response-r340"||r.legacyFallbackEnabled!==false||r.sourceSha!==sha||v.gasTransport!=="direct-json-primary"||v.responseContract!=="gas-direct-json-v1"||v.legacyFallbackEnabled!==false||v.sourceSha!==sha||h.status!=="healthy"||u.ok!==true||u.responseContract!=="gas-direct-json-v1"||u.upstream?.checked!==true||u.upstream?.ok!==true||u.upstream?.transport!=="gas-direct-json")process.exit(1)' "$ready" "$version" "$health" "$upstream" "$GITHUB_SHA"
          tmp_dir="$(mktemp -d)"
          curl --max-time 30 -fsS "$CANARY_URL/" -o "$tmp_dir/index.html"
          curl --max-time 30 -fsS "$CANARY_URL/app-config.js" -o "$tmp_dir/app-config.js"
          curl --max-time 30 -fsS "$CANARY_URL/cloud-run-transport.js" -o "$tmp_dir/cloud-run-transport.js"
          curl --max-time 30 -fsS "$CANARY_URL/meeting-controller.html" -o "$tmp_dir/meeting-controller.html"
          grep -q 'CANONICAL CLOUD RUN FRONTEND r331-v62' "$tmp_dir/index.html"
          grep -q 'cr8.5-dashboard-data-recovery' "$tmp_dir/app-config.js"
          grep -q 'cloud-run-gas-canonical-cr8' "$tmp_dir/cloud-run-transport.js"
          grep -q 'repairMeetingCanonicalMountCurrent' "$tmp_dir/index.html"
          grep -q 'ensureCanonicalPageControllerCurrent' "$tmp_dir/index.html"
          grep -q 'force:id===\"meeting\"' "$tmp_dir/index.html"
          grep -q 'fetchStaticMeetingController' "$tmp_dir/index.html"
          grep -q 'warmMeetingSharedAssets' "$tmp_dir/index.html"
          grep -q 'page.meeting.staticController' "$tmp_dir/index.html"
          grep -q 'recoverDashboardRuntimeCrit' "$tmp_dir/index.html"
          grep -q 'dashboard.dataRecovery.current' "$tmp_dir/index.html"
          grep -q 'dashboard-runtime-recovery-r345' "$tmp_dir/index.html"
          grep -q 'CR-8.3 Cloud Run static Meeting controller' "$tmp_dir/meeting-controller.html"
          grep -q 'window.initMeetingPage' "$tmp_dir/meeting-controller.html"
          grep -q 'AppPages.register("meeting"' "$tmp_dir/meeting-controller.html"

      - name: Promote CR-8 GAS-canonical to production
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE"             --project "$PROJECT_ID" --region "$REGION"             --source cloud-run-gateway --allow-unauthenticated             --cpu 1 --memory 512Mi --concurrency 40             --min-instances 0 --max-instances 5 --timeout 300             --set-env-vars "GAS_WEB_APP_URL=$GAS_WEB_APP_URL,GATEWAY_ALLOWED_ORIGINS=$CLOUD_RUN_ORIGIN,APP_SOURCE_SHA=$GITHUB_SHA"

      - name: Smoke final CR-8 production
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          ready="$(curl --max-time 30 -fsS "$url/ready")"
          version="$(curl --max-time 30 -fsS "$url/version")"
          health="$(curl --max-time 30 -fsS "$url/health")"
          upstream=""
          for attempt in 1 2 3; do
            if candidate="$(curl --max-time 45 -fsS "$url/upstream-health")"; then
              upstream="$candidate"
              break
            fi
            test "$attempt" -lt 3 && sleep 4
          done
          test -n "$upstream" || { echo "Production upstream health failed after 3 attempts" >&2; exit 1; }
          echo "Ready: $ready"
          echo "Version: $version"
          echo "Health: $health"
          echo "Upstream: $upstream"
          node -e 'const r=JSON.parse(process.argv[1]),v=JSON.parse(process.argv[2]),h=JSON.parse(process.argv[3]),u=JSON.parse(process.argv[4]),sha=process.argv[5];if(r.gateway!=="cr8-gas-canonical-response-r340"||r.legacyFallbackEnabled!==false||r.sourceSha!==sha||v.frontendHost!=="cloud-run"||v.gasTransport!=="direct-json-primary"||v.responseContract!=="gas-direct-json-v1"||v.legacyFallbackEnabled!==false||v.sourceSha!==sha||h.status!=="healthy"||u.ok!==true||u.responseContract!=="gas-direct-json-v1"||u.upstream?.checked!==true||u.upstream?.ok!==true||u.upstream?.transport!=="gas-direct-json")process.exit(1)' "$ready" "$version" "$health" "$upstream" "$GITHUB_SHA"
          tmp_dir="$(mktemp -d)"
          curl --max-time 30 -fsS "$url/" -o "$tmp_dir/index.html"
          curl --max-time 30 -fsS "$url/app-config.js" -o "$tmp_dir/app-config.js"
          curl --max-time 30 -fsS "$url/cloud-run-transport.js" -o "$tmp_dir/cloud-run-transport.js"
          curl --max-time 30 -fsS "$url/meeting-controller.html" -o "$tmp_dir/meeting-controller.html"
          grep -q 'CANONICAL CLOUD RUN FRONTEND r331-v62' "$tmp_dir/index.html"
          grep -q 'cr8.5-dashboard-data-recovery' "$tmp_dir/app-config.js"
          grep -q 'cloud-run-gas-canonical-cr8' "$tmp_dir/cloud-run-transport.js"
          grep -q 'repairMeetingCanonicalMountCurrent' "$tmp_dir/index.html"
          grep -q 'ensureCanonicalPageControllerCurrent' "$tmp_dir/index.html"
          grep -q 'force:id===\"meeting\"' "$tmp_dir/index.html"
          grep -q 'fetchStaticMeetingController' "$tmp_dir/index.html"
          grep -q 'warmMeetingSharedAssets' "$tmp_dir/index.html"
          grep -q 'page.meeting.staticController' "$tmp_dir/index.html"
          grep -q 'recoverDashboardRuntimeCrit' "$tmp_dir/index.html"
          grep -q 'dashboard.dataRecovery.current' "$tmp_dir/index.html"
          grep -q 'dashboard-runtime-recovery-r345' "$tmp_dir/index.html"
          grep -q 'CR-8.3 Cloud Run static Meeting controller' "$tmp_dir/meeting-controller.html"
          grep -q 'window.initMeetingPage' "$tmp_dir/meeting-controller.html"
          grep -q 'AppPages.register("meeting"' "$tmp_dir/meeting-controller.html"
          echo "### CR-8 GAS Canonical Response" >> "$GITHUB_STEP_SUMMARY"
          echo "- Production URL: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "- Browser runtime: Cloud Run only" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend source: frontend/" >> "$GITHUB_STEP_SUMMARY"
          echo "- GAS transport: direct JSON" >> "$GITHUB_STEP_SUMMARY"
          echo "- Response owner: GAS (gas-direct-json-v1)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Legacy parent-origin RPC: removed" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove retired transport environment variables
        run: |
          gcloud run services update "$SERVICE" --project "$PROJECT_ID" --region "$REGION"             --remove-env-vars "GAS_RPC_VERSION,GAS_PARENT_ORIGIN,LEGACY_GAS_RPC_FALLBACK,LEGACY_GAS_RPC_VERSION,LEGACY_GAS_PARENT_ORIGIN" || true

      - name: Remove CR-8 canary
        if: always()
        run: |
          gcloud run services delete "$CANARY_SERVICE" --project "$PROJECT_ID" --region "$REGION" --quiet || true
