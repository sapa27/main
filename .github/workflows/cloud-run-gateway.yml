          test -n "${E2E_SMOKE_USERNAME:-}" || { echo "P11 production gate failed: E2E_SMOKE_USERNAME is required" >&2; exit 1; }
          test -n "${E2E_SMOKE_PASSWORD:-}" || { echo "P11 production gate failed: E2E_SMOKE_PASSWORD is required" >&2; exit 1; }

          auth_dir="$(mktemp -d)"
            AUTH_REQ_FILE="$auth_dir/login.request.json" \
            E2E_SMOKE_USERNAME="$E2E_SMOKE_USERNAME" E2E_SMOKE_PASSWORD="$E2E_SMOKE_PASSWORD" node <<'NODE'
          const fs=require('fs');
          const username=process.env.E2E_SMOKE_USERNAME||'';
          const password=process.env.E2E_SMOKE_PASSWORD||'';
          if(!username||!password) process.exit(1);
          fs.writeFileSync(process.env.AUTH_REQ_FILE,JSON.stringify({
            method:'apiLogin',
