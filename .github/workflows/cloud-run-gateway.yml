  verify_subcommittee:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-subcommittee]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      PUBLIC_APP_ORIGIN: ${{ vars.PUBLIC_APP_ORIGIN }}
      E2E_SMOKE_USERNAME: ${{ secrets.E2E_SMOKE_USERNAME }}
      E2E_SMOKE_PASSWORD: ${{ secrets.E2E_SMOKE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify current subcommittee API without deployment
        shell: bash
        run: |
          node --input-type=commonjs <<'NODE_READ_LOGIN'
          const fs=require('node:fs'),os=require('node:os'),path=require('node:path'),cp=require('node:child_process');
          (async function(){
            const origin=new URL(process.env.PUBLIC_APP_ORIGIN || 'https://sapa27.anti27.workers.dev').origin;
            const username=process.env.E2E_SMOKE_USERNAME,password=process.env.E2E_SMOKE_PASSWORD;
            if(!username||!password) throw Error('SUBCOMMITTEE_CREDENTIALS_MISSING');
            const response=await fetch(origin+'/api/router',{method:'POST',headers:{'Content-Type':'application/json',Origin:origin},body:JSON.stringify({method:'apiLogin',payload:{username,email:username,password,clientContext:{source:'github-actions-p2-e2e',headless:true}},timeoutMs:45000}),signal:AbortSignal.timeout(65000)});
            const body=await response.json(),result=body.result||{},data=result.data||result,token=result.token||data.token,csrf=result.csrfToken||data.csrfToken||'';
            console.log('Subcommittee login metadata: '+JSON.stringify({http:response.status,transportOk:body.transportOk===true,applicationOk:result.ok===true,tokenPresent:!!token,resultKeys:Object.keys(result).slice(0,20)}));
            if(response.status!==200||body.transportOk!==true||result.ok!==true||!token) throw Error('SUBCOMMITTEE_LOGIN_FAILED');
            const dir=fs.mkdtempSync(path.join(os.tmpdir(),'subcommittee-read-'));
            try{
              const request=path.join(dir,'session.json'),script=path.join(dir,'gate.cjs');
              fs.writeFileSync(request,JSON.stringify({payload:{token,sessionToken:token,csrfToken:csrf,csrf,_csrf:csrf}}),{mode:0o600});
              const workflow=fs.readFileSync('.github/workflows/cloud-run-gateway.yml','utf8');
              const start=workflow.indexOf("node <<'NODE_SUBCOMMITTEE'\n")+"node <<'NODE_SUBCOMMITTEE'\n".length,end=workflow.indexOf('          NODE_SUBCOMMITTEE',start);
              if(end<start) throw Error('SUBCOMMITTEE_GATE_NOT_FOUND');
              fs.writeFileSync(script,workflow.slice(start,end),{mode:0o600});
              const run=cp.spawnSync(process.execPath,[script],{stdio:'inherit',env:{...process.env,AUTH_SESSION_REQ:request,P2_EDGE_ORIGIN:origin}});
              if(run.status!==0) process.exitCode=1;
            }finally{fs.rmSync(dir,{recursive:true,force:true});}
          })().catch(error=>{console.error(String((String(error.message||'').match(/SUBCOMMITTEE_[A-Z_]+/)||[])[0]||error.code||'SUBCOMMITTEE_READ_FAILED'));process.exitCode=1;});
          NODE_READ_LOGIN
