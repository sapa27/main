          echo "- Browser runtime: same-origin (P0-F edge-ready)" >> "$GITHUB_STEP_SUMMARY"
          echo "- P0-F-A Network Access Compatibility: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- P0-F-B1 workers.dev edge: deployment gate follows production smoke" >> "$GITHUB_STEP_SUMMARY"
          echo "### P4 Dashboard Bootstrap Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dashboard controller readiness owner: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- First complete-data settle gate: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Duplicate login Dashboard autostart owner: REMOVED" >> "$GITHUB_STEP_SUMMARY"
          echo "### P5 Dashboard Recovery Consolidation Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Recovery owner: single-flight" >> "$GITHUB_STEP_SUMMARY"
          echo "- Retry generation reset per authenticated bootstrap: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Dashboard controller recovery preserves data-ready state: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "### P6 Session / Write Stability Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Canonical AppStore auth overrides stale caller credentials: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- SESSION_TOKEN_ROTATED_RETRY bounded immediate retry: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Strict action token is re-issued after session rotation: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rotated opaque resume handle capture: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend source: frontend/" >> "$GITHUB_STEP_SUMMARY"
          echo "- GAS transport: direct JSON" >> "$GITHUB_STEP_SUMMARY"
