      - name: Deploy P0-F-B1 Cloudflare workers.dev edge
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo "P11 production gate failed: CLOUDFLARE_ACCOUNT_ID is required" >&2; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "P11 production gate failed: CLOUDFLARE_API_TOKEN is required" >&2; exit 1; }

          edge_origin="https://${CF_WORKER_NAME}.${CF_WORKERS_SUBDOMAIN}.workers.dev"
          test "${PUBLIC_APP_ORIGIN:-}" = "$edge_origin"

          subdomain_tmp="$(mktemp)"
          subdomain_status="$(curl --max-time 30 -sS -o "$subdomain_tmp" -w '%{http_code}'             -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json")"

          if [ "$subdomain_status" = "200" ]; then
            node -e 'const fs=require("fs"),x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.success!==true||x.result?.subdomain!==process.argv[2])process.exit(1)' "$subdomain_tmp" "$CF_WORKERS_SUBDOMAIN" || {
              echo "Existing workers.dev subdomain differs from expected $CF_WORKERS_SUBDOMAIN" >&2
              cat "$subdomain_tmp" >&2
              exit 1
            }
            echo "Using existing workers.dev subdomain: $CF_WORKERS_SUBDOMAIN"
          elif [ "$subdomain_status" = "404" ]; then
            subdomain_payload="$(printf '{"subdomain":"%s"}' "$CF_WORKERS_SUBDOMAIN")"
            subdomain_result="$(curl --max-time 30 -fsS               -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json"               --data "$subdomain_payload")"
            node -e 'const x=JSON.parse(process.argv[1]);if(x.success!==true||x.result?.subdomain!==process.argv[2])process.exit(1)' "$subdomain_result" "$CF_WORKERS_SUBDOMAIN"
            echo "Created workers.dev subdomain: $CF_WORKERS_SUBDOMAIN"
          else
            echo "Unable to read Cloudflare workers.dev subdomain (HTTP $subdomain_status)" >&2
            cat "$subdomain_tmp" >&2
            exit 1
          fi

          tmp_edge="$(mktemp -d)"
          cat > "$tmp_edge/worker.mjs" <<'EDGE_WORKER'
          export default {
            async fetch(request, env) {
              const incoming = new URL(request.url);
              const upstreamBase = new URL(env.CLOUD_RUN_ORIGIN);
              const target = new URL(incoming.pathname + incoming.search, upstreamBase);
              const headers = new Headers(request.headers);
              headers.delete("host");
              headers.delete("content-length");
              headers.set("X-Forwarded-Host", incoming.host);
              headers.set("X-Forwarded-Proto", "https");
              headers.set("X-Edge-Provider", "cloudflare");

              const init = {
                method: request.method,
                headers,
                redirect: "manual"
              };
              if (request.method !== "GET" && request.method !== "HEAD") init.body = request.body;

              const upstream = await fetch(target.toString(), init);
              const responseHeaders = new Headers(upstream.headers);
              responseHeaders.set("X-P0F-Edge", "cloudflare-workers-dev");

              const location = responseHeaders.get("Location");
              if (location) {
                try {
                  const redirectUrl = new URL(location);
                  if (redirectUrl.origin === upstreamBase.origin) {
                    redirectUrl.protocol = incoming.protocol;
                    redirectUrl.host = incoming.host;
                    responseHeaders.set("Location", redirectUrl.toString());
                  }
                } catch (_) {}
              }

              return new Response(upstream.body, {
                status: upstream.status,
                statusText: upstream.statusText,
                headers: responseHeaders
              });
            }
          };
          EDGE_WORKER

          node -e 'const fs=require("fs");const p=process.argv[1],name=process.argv[2],origin=process.argv[3];fs.writeFileSync(p,JSON.stringify({name,main:"./worker.mjs",compatibility_date:"2026-09-22",workers_dev:true,preview_urls:false,vars:{CLOUD_RUN_ORIGIN:origin}},null,2))'             "$tmp_edge/wrangler.jsonc" "$CF_WORKER_NAME" "$CLOUD_RUN_ORIGIN"

          node --check "$tmp_edge/worker.mjs"
          npx --yes wrangler@4.136.1 deploy --config "$tmp_edge/wrangler.jsonc"

          script_subdomain="$(curl --max-time 30 -fsS             -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$CF_WORKER_NAME/subdomain"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H "Content-Type: application/json"             --data '{"enabled":true,"previews_enabled":false}')"
          node -e 'const x=JSON.parse(process.argv[1]);if(x.success!==true||x.result?.enabled!==true||x.result?.previews_enabled!==false)process.exit(1)' "$script_subdomain"

          edge_network=""
          for attempt in 1 2 3 4 5; do
            if candidate="$(curl --max-time 30 -fsS "$edge_origin/network-health")"; then
              edge_network="$candidate"
              break
            fi
            test "$attempt" -lt 5 && sleep 3
          done
          test -n "$edge_network" || { echo "P0-F-B1 edge network-health unavailable" >&2; exit 1; }
          node -e 'const n=JSON.parse(process.argv[1]),sha=process.argv[2];if(n.ok!==true||n.status!=="reachable"||n.sourceSha!==sha||n.network?.gate!=="P0-F"||n.network?.publicOriginConfigured!==true||n.network?.originMode!=="public-edge"||n.network?.edge?.detected!==true||n.network?.edge?.provider!=="cloudflare"||n.upstream?.checked!==false||!n.cloudRun?.service||!n.cloudRun?.revision)process.exit(1)' "$edge_network" "$GITHUB_SHA"
          echo "P0 public edge source SHA attested: $GITHUB_SHA"

          edge_upstream=""
          for attempt in 1 2 3; do
            if candidate="$(curl --max-time 75 --retry 2 --retry-delay 2 --retry-all-errors -fsS "$edge_origin/upstream-health")"; then
              edge_upstream="$candidate"
              break
            fi
            test "$attempt" -lt 3 && sleep 3
          done
          test -n "$edge_upstream" || { echo "P0-F-B1 edge upstream-health unavailable" >&2; exit 1; }
          node -e 'const u=JSON.parse(process.argv[1]);if(u.ok!==true||u.responseContract!=="gas-direct-json-v1"||u.upstream?.checked!==true||u.upstream?.ok!==true||u.upstream?.transport!=="gas-direct-json")process.exit(1)' "$edge_upstream"

          # P2 mandatory E2E POST gate: public edge -> Cloud Run -> GAS.
          p2_rpc_dir="$(mktemp -d)"
          p2_post_rpc() {
            local label="$1"
            local payload="$2"
            local body_file="$p2_rpc_dir/$label.body.json"
            local header_file="$p2_rpc_dir/$label.headers.txt"
            local http_code=""
            for attempt in 1 2 3; do
              http_code="$(curl --max-time 45 --retry 1 --retry-delay 2 --retry-all-errors -sS \
                -D "$header_file" -o "$body_file" -w '%{http_code}' \
                -H 'Content-Type: application/json' \
                -H "Origin: $edge_origin" \
                --data "$payload" \
                "$edge_origin/api/router" || true)"
              if [ "$http_code" = "200" ]; then
                break
              fi
              test "$attempt" -lt 3 && sleep 3
            done
            test "$http_code" = "200" || { echo "P2 $label POST failed (HTTP $http_code)" >&2; exit 1; }

            P2_BODY_FILE="$body_file" P2_HEADER_FILE="$header_file" P2_EDGE_ORIGIN="$edge_origin" node <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync(process.env.P2_BODY_FILE,'utf8'));
          const headers=fs.readFileSync(process.env.P2_HEADER_FILE,'utf8').split(/\r?\n/);
          const get=name=>{
            const prefix=name.toLowerCase()+':';
            const line=headers.find(x=>x.toLowerCase().startsWith(prefix));
            return line?line.slice(line.indexOf(':')+1).trim():'';
          };
          if(body?.transportOk!==true||!Object.prototype.hasOwnProperty.call(body,'result')) process.exit(1);
          if(get('x-gas-response-contract')!=='gas-direct-json-v1') process.exit(1);
          if(get('x-p0f-edge')!=='cloudflare-workers-dev') process.exit(1);
          if(get('access-control-allow-origin')!==process.env.P2_EDGE_ORIGIN) process.exit(1);
          const requestId=get('x-request-id');
          if(!/^[A-Za-z0-9_.:-]{6,128}$/.test(requestId)) process.exit(1);
          NODE
          }

          p2_post_rpc "direct-session-check" '{"method":"apiSessionCheck","payload":{},"timeoutMs":30000}'
          p2_post_rpc "nested-router-session-check" '{"method":"apiRouter","payload":{"method":"apiSessionCheck","payload":{}},"timeoutMs":30000}'

          echo "### P2 End-to-End Transport Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public POST /api/router: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Direct apiSessionCheck: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Nested apiRouter → apiSessionCheck: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Contract: gas-direct-json-v1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Edge marker: cloudflare-workers-dev" >> "$GITHUB_STEP_SUMMARY"

