          grep -q 'function resetActionAuthCrit' "$tmp_dir/index.html"
          grep -q 'nextSessionToken' "$tmp_dir/index.html"
          grep -q 'nextCsrfToken' "$tmp_dir/index.html"
          grep -q 'dashboard-runtime-recovery-r345' "$tmp_dir/index.html"
          grep -q 'patchDashboardControllerContractCurrent' "$tmp_dir/index.html"
          grep -q 'dashboard-critical-first-r347' "$tmp_dir/index.html"
          grep -q 'dashboard-initial-data-gate-p4' "$tmp_dir/index.html"
          grep -q 'auth.dashboardDataReady' "$tmp_dir/index.html"
          grep -q 'critical-login-runtime-p4' "$tmp_dir/index.html"
          if grep -q 'app-login-dashboard-autostart-current' "$tmp_dir/index.html"; then echo "P4 failed: duplicate Dashboard autostart owner is still deployed" >&2; exit 1; fi
          grep -q 'deferred-auth-handoff-r353' "$tmp_dir/index.html"
          grep -q 'DASHBOARD_AUTH_TOKEN_NOT_READY' "$tmp_dir/index.html"
          grep -q 'direct-bootstrap-r349' "$tmp_dir/index.html"
          grep -q 'CR-8.3 Cloud Run static Meeting controller' "$tmp_dir/meeting-controller.html"
          grep -q 'window.initMeetingPage' "$tmp_dir/meeting-controller.html"
