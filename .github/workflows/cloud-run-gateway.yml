name: Cloud Run Production
# zero-error-boxes-final-20260925
# manifest-canonical-gas-20260930
on:
  push:
    paths:
      - 'cloud-run-gateway/**'
      - 'frontend/**'
      - '.github/tests/regression.mjs'
      - '.github/workflows/cloud-run-gateway.yml'
  pull_request:
    paths:
      - 'cloud-run-gateway/**'
      - 'frontend/**'
      - '.github/tests/regression.mjs'
      - '.github/workflows/cloud-run-gateway.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy validated CR-8 GAS-canonical production service'
        required: true
        type: boolean
        default: false

concurrency:
  group: cloud-run-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Stage production frontend
        run: |
          set -euo pipefail
          rm -rf cloud-run-gateway/public
          cp -R frontend cloud-run-gateway/public
          test -f cloud-run-gateway/public/index.html
          test -f cloud-run-gateway/public/app-config.js
          test -f cloud-run-gateway/public/cloud-run-transport.js
          test -f cloud-run-gateway/public/meeting-controller.html
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate CR-8 frontend and gateway
        run: |
          set -euo pipefail
          node .github/tests/regression.mjs --frontend-only
          cd cloud-run-gateway
          npm run check
          npm test
      - name: Validate container build
        run: docker build --file cloud-run-gateway/Dockerfile cloud-run-gateway

  deploy:
    needs: validate
    if: (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-cloud-run]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'sapa27' }}
      REGION: ${{ vars.GCP_REGION || 'asia-southeast3' }}
      SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'sapa27-gateway' }}
      CANARY_SERVICE: sapa27-gateway-cr8-canary
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || 'projects/770468331446/locations/global/workloadIdentityPools/github-actions/providers/sapa27-main' }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT || 'github-cloud-run-deployer@sapa27.iam.gserviceaccount.com' }}
      GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
      GAS_CANDIDATE_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
      ANTI_GAS_WEB_APP_URL: ${{ vars.ANTI_GAS_WEB_APP_URL }}
      CLOUD_RUN_ORIGIN: ${{ vars.CLOUD_RUN_ORIGIN || 'https://sapa27-gateway-asxuzzwspa-eu.a.run.app' }}
      PUBLIC_APP_ORIGIN: ${{ vars.PUBLIC_APP_ORIGIN }}
      CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME || 'sapa27' }}
      CF_WORKERS_SUBDOMAIN: ${{ vars.CF_WORKERS_SUBDOMAIN || 'anti27' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      E2E_SMOKE_USERNAME: ${{ secrets.E2E_SMOKE_USERNAME }}
      E2E_SMOKE_PASSWORD: ${{ secrets.E2E_SMOKE_PASSWORD }}
      ANTI_PUBLIC_ORIGIN: https://sapa27.github.io
    steps:
      - uses: actions/checkout@v4
      - name: Stage production frontend
        run: |
          set -euo pipefail
          rm -rf cloud-run-gateway/public
          cp -R frontend cloud-run-gateway/public
      - name: Lock production GAS endpoint to repository manifest
        run: |
          set -euo pipefail
          canonical_gas_url="$(node -e 'const fs=require("fs");const x=JSON.parse(fs.readFileSync("MANIFEST.json","utf8"));const v=String(x.productionGasWebAppUrl||"");const p="https://script.google.com/macros/s/";if(!v.startsWith(p)||!v.endsWith("/exec")||v.slice(p.length,-5).includes("/"))process.exit(1);process.stdout.write(v)')"
          if [ "$GAS_WEB_APP_URL" != "$canonical_gas_url" ]; then
            echo "GAS_WEB_APP_URL differs from MANIFEST.json; using the repository-canonical endpoint"
            echo "GAS_WEB_APP_URL=$canonical_gas_url" >> "$GITHUB_ENV"
            echo "GAS_CANDIDATE_WEB_APP_URL=$canonical_gas_url" >> "$GITHUB_ENV"
          fi
          echo "### GAS Endpoint Source" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: MANIFEST.json productionGasWebAppUrl" >> "$GITHUB_STEP_SUMMARY"
      - name: Validate deployment variables
        run: |
          set -euo pipefail
          for name in PROJECT_ID REGION SERVICE CANARY_SERVICE WIF_PROVIDER DEPLOY_SERVICE_ACCOUNT GAS_WEB_APP_URL ANTI_GAS_WEB_APP_URL CLOUD_RUN_ORIGIN ANTI_PUBLIC_ORIGIN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CF_WORKER_NAME CF_WORKERS_SUBDOMAIN; do
            test -n "${!name:-}" || { echo "Missing required production gate variable: $name" >&2; exit 1; }
          done
      - name: Diagnose GAS primary and candidate endpoints
        run: |
          set -euo pipefail
          probe_gas() {
            local label="$1" url="$2" body_file header_file http_code
            body_file="$(mktemp)"
            header_file="$(mktemp)"
            http_code="$(curl --max-time 45 --retry 1 --retry-delay 2 --retry-all-errors -L -sS \
              -D "$header_file" -o "$body_file" -w '%{http_code}' \
              -H 'Content-Type: application/json;charset=UTF-8' \
              -H 'Accept: application/json' \
              --data '{"method":"apiSessionCheck","payload":{}}' \
              "$url" || true)"
            PROBE_BODY="$body_file" PROBE_HEADERS="$header_file" PROBE_LABEL="$label" PROBE_HTTP="$http_code" node <<'NODE'
          const fs=require('fs');
          const label=process.env.PROBE_LABEL||'GAS';
          const status=process.env.PROBE_HTTP||'0';
          const raw=fs.readFileSync(process.env.PROBE_BODY,'utf8');
          const headers=fs.readFileSync(process.env.PROBE_HEADERS,'utf8').split(/\r?\n/).filter(Boolean);
          const contentType=[...headers].reverse().find(x=>/^content-type:/i.test(x))?.split(':').slice(1).join(':').trim()||'';
          let x=null,json=false;
          try{x=JSON.parse(raw);json=true}catch(_){}
          const object=!!x&&typeof x==='object'&&!Array.isArray(x);
          const keys=object?Object.keys(x).slice(0,12).sort().join(','):'';
          const transportOk=object&&typeof x.transportOk==='boolean'?String(x.transportOk):'missing';
          const errorCode=object&&x.error&&typeof x.error==='object'?String(x.error.code||''):'';
          console.log(label+' GAS probe metadata: HTTP '+status+' contentType='+(contentType||'unknown')+' json='+json+' keys='+(keys||'none')+' transportOk='+transportOk+(errorCode?' errorCode='+errorCode:''));
          if(status!=='200'||!object||x.transportOk!==true||!Object.prototype.hasOwnProperty.call(x,'result'))process.exit(1);
          NODE
          }

          primary_ok=false
          candidate_ok=false
          probe_gas "primary" "$GAS_WEB_APP_URL" && primary_ok=true
          probe_gas "candidate" "$GAS_CANDIDATE_WEB_APP_URL" && candidate_ok=true

          echo "### GAS Endpoint Preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "- Primary canonical probe: $primary_ok" >> "$GITHUB_STEP_SUMMARY"
          echo "- Candidate canonical probe: $candidate_ok" >> "$GITHUB_STEP_SUMMARY"

          if [ "$primary_ok" != "true" ]; then
            if [ "$candidate_ok" = "true" ]; then
              echo "Primary GAS endpoint failed while candidate passed; explicit endpoint promotion is required before deployment." >&2
            else
              echo "Primary and candidate GAS endpoints both failed canonical direct JSON preflight." >&2
            fi
            exit 1
          fi
      - name: Resolve P0-F-B1 workers.dev origin
        run: |
          set -euo pipefail
          preferred_subdomain="${CF_WORKERS_SUBDOMAIN:-anti}"
          candidate_subdomains=("$preferred_subdomain" "anti27" "sapa27-anti" "anti-sapa27")

          [[ "$CF_WORKER_NAME" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$ ]] || { echo "Invalid CF_WORKER_NAME" >&2; exit 1; }
          for candidate in "${candidate_subdomains[@]}"; do
            [[ "$candidate" =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?$ ]] || { echo "Invalid CF_WORKERS_SUBDOMAIN candidate" >&2; exit 1; }
          done

          selected_subdomain="$preferred_subdomain"

          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            cf_subdomain_tmp="$(mktemp)"
            cf_subdomain_status="$(curl --max-time 30 -sS -o "$cf_subdomain_tmp" -w '%{http_code}'               -X GET "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json")"

            current_subdomain=""
            if [ "$cf_subdomain_status" = "200" ]; then
              current_subdomain="$(node -e 'const fs=require("fs"),x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.success!==true||!x.result?.subdomain)process.exit(1);process.stdout.write(x.result.subdomain)' "$cf_subdomain_tmp")"
            elif [ "$cf_subdomain_status" != "404" ]; then
              echo "Unable to read Cloudflare workers.dev subdomain (HTTP $cf_subdomain_status)" >&2
              cat "$cf_subdomain_tmp" >&2
              exit 1
            fi

            current_is_neutral=false
            for candidate in "${candidate_subdomains[@]}"; do
              if [ "$current_subdomain" = "$candidate" ]; then
                selected_subdomain="$current_subdomain"
                current_is_neutral=true
                break
              fi
            done

            if [ "$current_is_neutral" != "true" ]; then
              echo "Replacing personal workers.dev account subdomain with a neutral value"

              if [ -n "$current_subdomain" ]; then
                delete_tmp="$(mktemp)"
                delete_status="$(curl --max-time 30 -sS -o "$delete_tmp" -w '%{http_code}'                   -X DELETE "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"                   -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
                case "$delete_status" in
                  200|204) ;;
                  *)
                    echo "Unable to remove existing Cloudflare workers.dev subdomain (HTTP $delete_status)" >&2
                    cat "$delete_tmp" >&2
                    exit 1
                    ;;
                esac
              fi

              selected_subdomain=""
              for candidate in "${candidate_subdomains[@]}"; do
                candidate_tmp="$(mktemp)"
                candidate_status="$(curl --max-time 30 -sS -o "$candidate_tmp" -w '%{http_code}'                   -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"                   -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"                   -H "Content-Type: application/json"                   --data "$(printf '{"subdomain":"%s"}' "$candidate")")"

                if [ "$candidate_status" = "200" ]; then
                  node -e 'const fs=require("fs"),x=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(x.success!==true||x.result?.subdomain!==process.argv[2])process.exit(1)' "$candidate_tmp" "$candidate"
                  selected_subdomain="$candidate"
                  echo "Selected neutral workers.dev subdomain: $selected_subdomain"
                  break
                fi

                if [ "$candidate_status" != "403" ] && [ "$candidate_status" != "409" ]; then
                  echo "Unexpected Cloudflare response while selecting neutral workers.dev subdomain (HTTP $candidate_status)" >&2
                  cat "$candidate_tmp" >&2
                  break
                fi
              done

              if [ -z "$selected_subdomain" ]; then
                if [ -n "$current_subdomain" ]; then
                  echo "No neutral workers.dev candidate was available; attempting rollback"
                  rollback_tmp="$(mktemp)"
                  rollback_status="$(curl --max-time 30 -sS -o "$rollback_tmp" -w '%{http_code}'                     -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"                     -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"                     -H "Content-Type: application/json"                     --data "$(printf '{"subdomain":"%s"}' "$current_subdomain")")"
                  if [ "$rollback_status" = "200" ]; then
                    echo "Rollback restored previous workers.dev subdomain"
                  else
                    echo "Rollback of workers.dev subdomain failed (HTTP $rollback_status)" >&2
                    cat "$rollback_tmp" >&2
                  fi
                fi
                exit 1
              fi
            fi
          fi

          edge_origin="https://${CF_WORKER_NAME}.${selected_subdomain}.workers.dev"
          if [ -n "${PUBLIC_APP_ORIGIN:-}" ] && [ "$PUBLIC_APP_ORIGIN" != "$edge_origin" ]; then
            echo "PUBLIC_APP_ORIGIN differs from workers.dev target: $PUBLIC_APP_ORIGIN" >&2
            exit 1
          fi

          echo "CF_WORKERS_SUBDOMAIN=$selected_subdomain" >> "$GITHUB_ENV"
          echo "PUBLIC_APP_ORIGIN=$edge_origin" >> "$GITHUB_ENV"
          echo "P0FB_EDGE_ORIGIN=$edge_origin" >> "$GITHUB_ENV"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy CR-8 GAS-canonical canary
        run: |
          set -euo pipefail
          gcloud run deploy "$CANARY_SERVICE"             --project "$PROJECT_ID" --region "$REGION"             --source cloud-run-gateway --allow-unauthenticated             --cpu 1 --memory 512Mi --concurrency 20             --min-instances 0 --max-instances 2 --timeout 300             --set-env-vars "^@^GAS_WEB_APP_URL=$GAS_WEB_APP_URL@ANTI_GAS_WEB_APP_URL=$ANTI_GAS_WEB_APP_URL@GATEWAY_ALLOWED_ORIGINS=$CLOUD_RUN_ORIGIN,$ANTI_PUBLIC_ORIGIN,$PUBLIC_APP_ORIGIN@PUBLIC_APP_ORIGIN=$PUBLIC_APP_ORIGIN@APP_SOURCE_SHA=$GITHUB_SHA"
          canary_url="$(gcloud run services describe "$CANARY_SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          echo "CANARY_URL=$canary_url" >> "$GITHUB_ENV"

      - name: Require direct GAS transport on canary
        run: |
          set -euo pipefail
          ready="$(curl --max-time 30 -fsS "$CANARY_URL/ready")"
          version="$(curl --max-time 30 -fsS "$CANARY_URL/version")"
          health="$(curl --max-time 30 -fsS "$CANARY_URL/health")"
          network="$(curl --max-time 30 -fsS "$CANARY_URL/network-health")"
          upstream=""
          upstream_diag="$(mktemp)"
          for attempt in 1 2 3; do
            http_code="$(curl --max-time 45 -sS -o "$upstream_diag" -w '%{http_code}' "$CANARY_URL/upstream-health" || true)"
            candidate="$(cat "$upstream_diag" 2>/dev/null || true)"
            echo "Canary upstream attempt $attempt HTTP $http_code"
            test -n "$candidate" && echo "Canary upstream response: $candidate"
            if test "$http_code" = "200"; then
              upstream="$candidate"
              break
            fi
            test "$attempt" -lt 3 && sleep 4
          done
          test -n "$upstream" || { echo "Canary upstream health failed after 3 attempts" >&2; exit 1; }
          echo "Canary ready: $ready"
          echo "Canary version: $version"
          echo "Canary health: $health"
          echo "Canary network: $network"
          echo "Canary upstream: $upstream"
          node -e 'const n=JSON.parse(process.argv[1]);if(n.ok!==true||n.status!=="reachable"||n.network?.gate!=="P0-F"||n.network?.sameOriginBrowser!==true||n.upstream?.checked!==false)process.exit(1)' "$network"
          node -e 'const r=JSON.parse(process.argv[1]),v=JSON.parse(process.argv[2]),h=JSON.parse(process.argv[3]),u=JSON.parse(process.argv[4]),sha=process.argv[5];if(r.gateway!=="cr8.15-p0f-network-gate"||r.antiPublic?.configured!==true||r.antiPublic?.path!=="/api/anti"||r.legacyFallbackEnabled!==false||r.sourceSha!==sha||v.gasTransport!=="direct-json-primary"||v.responseContract!=="gas-direct-json-v1"||v.antiPublic?.responseContract!=="anti-public-json-v1"||v.legacyFallbackEnabled!==false||v.sourceSha!==sha||h.status!=="healthy"||u.ok!==true||u.responseContract!=="gas-direct-json-v1"||u.upstream?.checked!==true||u.upstream?.ok!==true||u.upstream?.transport!=="gas-direct-json")process.exit(1)' "$ready" "$version" "$health" "$upstream" "$GITHUB_SHA"
          tmp_dir="$(mktemp -d)"
          curl --max-time 30 -fsS "$CANARY_URL/" -o "$tmp_dir/index.html"
          curl --max-time 30 -fsS "$CANARY_URL/app-config.js" -o "$tmp_dir/app-config.js"
          curl --max-time 30 -fsS "$CANARY_URL/cloud-run-transport.js" -o "$tmp_dir/cloud-run-transport.js"
          curl --max-time 30 -fsS "$CANARY_URL/meeting-controller.html" -o "$tmp_dir/meeting-controller.html"
          grep -q 'CANONICAL CLOUD RUN FRONTEND r331-v62' "$tmp_dir/index.html"
          grep -q 'p0-f-edge-ready-20260922' "$tmp_dir/app-config.js"
          grep -q 'p0-f-network-access-compatibility-r354' "$tmp_dir/app-config.js"
          if grep -q '\.run\.app' "$tmp_dir/app-config.js"; then echo "P0-F failed: browser config contains run.app" >&2; exit 1; fi
          grep -q 'cloud-run-gas-canonical-cr8' "$tmp_dir/cloud-run-transport.js"
          grep -q 'gas-router-wire-r350' "$tmp_dir/cloud-run-transport.js"
          grep -q 'function gasWire(I)' "$tmp_dir/cloud-run-transport.js"
          grep -q 'repairMeetingCanonicalMountCurrent' "$tmp_dir/index.html"
          grep -q 'ensureCanonicalPageControllerCurrent' "$tmp_dir/index.html"
          grep -q 'force:id===\"meeting\"' "$tmp_dir/index.html"
          grep -q 'fetchStaticMeetingController' "$tmp_dir/index.html"
          grep -q 'warmMeetingSharedAssets' "$tmp_dir/index.html"
          grep -q 'page.meeting.staticController' "$tmp_dir/index.html"
          grep -q 'recoverDashboardRuntimeCrit' "$tmp_dir/index.html"
          grep -q 'dashboard.dataRecovery.current' "$tmp_dir/index.html"
          grep -q 'dashboard-data-recovery-p5' "$tmp_dir/index.html"
          grep -q 'recoveryState.reset("login-dashboard-bootstrap")' "$tmp_dir/index.html"
          grep -q 'rotationRetry=/SESSION_TOKEN_ROTATED_RETRY' "$tmp_dir/index.html"
          grep -q 'function syncAuthPayloadCrit' "$tmp_dir/index.html"
          grep -q 'function resetActionAuthCrit' "$tmp_dir/index.html"
          grep -q 'nextSessionToken' "$tmp_dir/index.html"
          grep -q 'nextCsrfToken' "$tmp_dir/index.html"
          grep -q 'dashboard-runtime-recovery-r345' "$tmp_dir/index.html"
          grep -q 'patchDashboardControllerContractCurrent' "$tmp_dir/index.html"
          grep -q 'dashboard-critical-first-r347' "$tmp_dir/index.html"
          grep -q 'dashboard-initial-data-gate-p4' "$tmp_dir/index.html"
          grep -q 'auth.dashboardDataReady' "$tmp_dir/index.html"
          grep -q 'critical-login-runtime-p4' "$tmp_dir/index.html"
          if grep -q 'app-login-dashboard-autostart-current' "$tmp_dir/index.html"; then echo "P4 failed: duplicate Dashboard autostart owner is still deployed" >&2; exit 1; fi
          grep -q 'deferred-auth-handoff-r353' "$tmp_dir/index.html"
          grep -q 'DASHBOARD_AUTH_TOKEN_NOT_READY' "$tmp_dir/index.html"
          grep -q 'direct-bootstrap-r349' "$tmp_dir/index.html"
          grep -q 'CR-8.3 Cloud Run static Meeting controller' "$tmp_dir/meeting-controller.html"
          grep -q 'window.initMeetingPage' "$tmp_dir/meeting-controller.html"
          grep -q 'AppPages.register("meeting"' "$tmp_dir/meeting-controller.html"

      - name: Promote CR-8 GAS-canonical to production
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE"             --project "$PROJECT_ID" --region "$REGION"             --source cloud-run-gateway --allow-unauthenticated             --cpu 1 --memory 512Mi --concurrency 40             --min-instances 0 --max-instances 5 --timeout 300             --set-env-vars "^@^GAS_WEB_APP_URL=$GAS_WEB_APP_URL@ANTI_GAS_WEB_APP_URL=$ANTI_GAS_WEB_APP_URL@GATEWAY_ALLOWED_ORIGINS=$CLOUD_RUN_ORIGIN,$ANTI_PUBLIC_ORIGIN,$PUBLIC_APP_ORIGIN@PUBLIC_APP_ORIGIN=$PUBLIC_APP_ORIGIN@APP_SOURCE_SHA=$GITHUB_SHA"

      - name: Remove retired transport environment variables
        run: |
          gcloud run services update "$SERVICE" --project "$PROJECT_ID" --region "$REGION"             --remove-env-vars "GAS_RPC_VERSION,GAS_PARENT_ORIGIN,LEGACY_GAS_RPC_FALLBACK,LEGACY_GAS_RPC_VERSION,LEGACY_GAS_PARENT_ORIGIN" || true

      - name: Smoke final CR-8 production
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          ready="$(curl --max-time 30 -fsS "$url/ready")"
          version="$(curl --max-time 30 -fsS "$url/version")"
          health="$(curl --max-time 30 -fsS "$url/health")"
          network="$(curl --max-time 30 -fsS "$url/network-health")"
          upstream=""
          for attempt in 1 2 3; do
            if candidate="$(curl --max-time 45 -fsS "$url/upstream-health")"; then
              upstream="$candidate"
              break
            fi
            test "$attempt" -lt 3 && sleep 4
          done
          test -n "$upstream" || { echo "Production upstream health failed after 3 attempts" >&2; exit 1; }
          echo "Ready: $ready"
          echo "Version: $version"
          echo "Health: $health"
          echo "Network: $network"
          echo "Upstream: $upstream"
          node -e 'const n=JSON.parse(process.argv[1]);if(n.ok!==true||n.status!=="reachable"||n.network?.gate!=="P0-F"||n.network?.sameOriginBrowser!==true||n.upstream?.checked!==false)process.exit(1)' "$network"
          node -e 'const r=JSON.parse(process.argv[1]),v=JSON.parse(process.argv[2]),h=JSON.parse(process.argv[3]),u=JSON.parse(process.argv[4]),sha=process.argv[5];if(r.gateway!=="cr8.15-p0f-network-gate"||r.antiPublic?.configured!==true||r.antiPublic?.path!=="/api/anti"||r.legacyFallbackEnabled!==false||r.sourceSha!==sha||v.frontendHost!=="same-origin"||v.gasTransport!=="direct-json-primary"||v.responseContract!=="gas-direct-json-v1"||v.antiPublic?.responseContract!=="anti-public-json-v1"||v.legacyFallbackEnabled!==false||v.sourceSha!==sha||h.status!=="healthy"||u.ok!==true||u.responseContract!=="gas-direct-json-v1"||u.upstream?.checked!==true||u.upstream?.ok!==true||u.upstream?.transport!=="gas-direct-json")process.exit(1)' "$ready" "$version" "$health" "$upstream" "$GITHUB_SHA"
          tmp_dir="$(mktemp -d)"
          curl --max-time 30 -fsS "$url/" -o "$tmp_dir/index.html"
          curl --max-time 30 -fsS "$url/app-config.js" -o "$tmp_dir/app-config.js"
          curl --max-time 30 -fsS "$url/cloud-run-transport.js" -o "$tmp_dir/cloud-run-transport.js"
          curl --max-time 30 -fsS "$url/meeting-controller.html" -o "$tmp_dir/meeting-controller.html"
          grep -q 'CANONICAL CLOUD RUN FRONTEND r331-v62' "$tmp_dir/index.html"
          grep -q 'p0-f-edge-ready-20260922' "$tmp_dir/app-config.js"
          grep -q 'p0-f-network-access-compatibility-r354' "$tmp_dir/app-config.js"
          if grep -q '\.run\.app' "$tmp_dir/app-config.js"; then echo "P0-F failed: browser config contains run.app" >&2; exit 1; fi
