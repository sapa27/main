          if grep -q 'google.script.run' "$edge_index_tmp"; then echo "P12 edge failed: retired browser GAS fallback returned" >&2; exit 1; fi
          grep -q 'fetchStaticPartialCurrent' "$edge_index_tmp"
          if grep -q 'root2.AppApi.call("getDeferredInclude"' "$edge_index_tmp"; then echo "P0 static migration failed: browser still fetches controllers from GAS" >&2; exit 1; fi
          curl --max-time 30 --retry 2 --retry-delay 1 --retry-all-errors -fsS "$edge_origin/static-partials-manifest.json" | grep -q 'cloud-run-static-partials-p0-20261002'
          if grep -q 'AppTransport.run=root2.AppTransport.run||' "$edge_index_tmp"; then echo "P12 edge failed: duplicate AppTransport fallback owner returned" >&2; exit 1; fi
          if grep -q 'app-login-dashboard-autostart-current' "$edge_index_tmp"; then echo "P4 edge failed: duplicate Dashboard autostart owner is still public" >&2; exit 1; fi
