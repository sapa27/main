            login_code="$(curl --max-time 60 --retry 1 --retry-delay 2 --retry-all-errors -sS \
              -D "$auth_dir/login.headers.txt" -o "$auth_dir/login.body.json" -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -H "Origin: $edge_origin" \
              --data-binary "@$auth_dir/login.request.json" \
              "$edge_origin/api/router" || true)"
            test "$login_code" = "200" || { echo "P2 authenticated apiLogin failed (HTTP $login_code)" >&2; exit 1; }

            AUTH_LOGIN_BODY="$auth_dir/login.body.json" AUTH_LOGIN_HEADERS="$auth_dir/login.headers.txt" AUTH_SESSION_REQ="$auth_dir/session.request.json" AUTH_DASHBOARD_ASSET_REQ="$auth_dir/dashboard-asset.request.json" AUTH_DASHBOARD_DATA_REQ="$auth_dir/dashboard-data.request.json" P2_EDGE_ORIGIN="$edge_origin" node <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync(process.env.AUTH_LOGIN_BODY,'utf8'));
          const headers=fs.readFileSync(process.env.AUTH_LOGIN_HEADERS,'utf8').split(/\r?\n/);
          const get=name=>{
            const prefix=name.toLowerCase()+':';
            const line=headers.find(x=>x.toLowerCase().startsWith(prefix));
            return line?line.slice(line.indexOf(':')+1).trim():'';
          };
          if(get('x-gas-response-contract')!=='gas-direct-json-v1'||get('x-p0f-edge')!=='cloudflare-workers-dev') process.exit(1);
          if(get('access-control-allow-origin')!==process.env.P2_EDGE_ORIGIN) process.exit(1);
          if(body?.transportOk!==true) process.exit(1);
          const candidates=[body.result,body.result?.result,body.result?.data,body.result?.data?.data];
          const auth=candidates.find(x=>x&&typeof x==='object'&&!Array.isArray(x)&&(x.token||x.nextToken||x.sessionToken));
          if(!auth) process.exit(1);
          const token=String(auth.token||auth.nextToken||auth.sessionToken||'');
          const csrf=String(auth.csrfToken||auth.csrf||'');
