            if(typeof current.html==='string'){html=current.html;break}
            if(Object.prototype.hasOwnProperty.call(current,'data')){current=current.data;continue}
            if(Object.prototype.hasOwnProperty.call(current,'result')){current=current.result;continue}
            break;
          }
          if(typeof current==='string'&&!html) html=current;
          if(!html.trim()||!/<script\b/i.test(html)||!/dashboard/i.test(html)) process.exit(1);
          NODE

            dashboard_data_code="$(curl --max-time 85 --retry 1 --retry-delay 2 --retry-all-errors -sS \
              -D "$auth_dir/dashboard-data.headers.txt" -o "$auth_dir/dashboard-data.body.json" -w '%{http_code}' \
              -H 'Content-Type: application/json' \
              -H "Origin: $edge_origin" \
              --data-binary "@$auth_dir/dashboard-data.request.json" \
              "$edge_origin/api/router" || true)"
            test "$dashboard_data_code" = "200" || { echo "P3 Dashboard data fetch failed (HTTP $dashboard_data_code)" >&2; exit 1; }

            AUTH_DASHBOARD_DATA_BODY="$auth_dir/dashboard-data.body.json" AUTH_DASHBOARD_DATA_HEADERS="$auth_dir/dashboard-data.headers.txt" P3_EDGE_ORIGIN="$edge_origin" node <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync(process.env.AUTH_DASHBOARD_DATA_BODY,'utf8'));
          const headers=fs.readFileSync(process.env.AUTH_DASHBOARD_DATA_HEADERS,'utf8').split(/\r?\n/);
          const get=name=>{
            const prefix=name.toLowerCase()+':';
            const line=headers.find(x=>x.toLowerCase().startsWith(prefix));
            return line?line.slice(line.indexOf(':')+1).trim():'';
          };
          if(get('x-gas-response-contract')!=='gas-direct-json-v1'||get('x-p0f-edge')!=='cloudflare-workers-dev') process.exit(1);
          if(get('access-control-allow-origin')!==process.env.P3_EDGE_ORIGIN) process.exit(1);
          if(body?.transportOk!==true||!Object.prototype.hasOwnProperty.call(body,'result')) process.exit(1);
          const result=body.result;
          if(result&&typeof result==='object'&&result.ok===false) process.exit(1);
          let current=result;
          for(let depth=0;depth<5&&current&&typeof current==='object'&&!Array.isArray(current)&&current.data&&typeof current.data==='object';depth++)current=current.data;
          if(!current||typeof current!=='object'||Array.isArray(current)) process.exit(1);
          NODE

            mkdir -p "$auth_dir/p7"
            P7_AUTH_SOURCE="$auth_dir/dashboard-data.request.json" P7_DIR="$auth_dir/p7" node <<'NODE'
          const fs=require('fs'),path=require('path');
          const request=JSON.parse(fs.readFileSync(process.env.P7_AUTH_SOURCE,'utf8'));
          const auth=request?.payload?.payload||{};
          const common={
            token:String(auth.token||''),
            sessionToken:String(auth.sessionToken||auth.token||''),
            csrfToken:String(auth.csrfToken||''),
            csrf:String(auth.csrf||auth.csrfToken||''),
            _csrf:String(auth._csrf||auth.csrfToken||'')
          };
          if(!common.token) process.exit(1);
          const probes={
            apiGetDashboardBundle:{phase1FirstPaint:false,hotPathMode:'performance-baseline-complete',includeBudgetSummary:true},
            apiSearchCasesLite:{page:1,limit:20,compactReadModel:true,includeMeetingHistory:false},
            apiGetCommitteeMeetingSystem:{page:1,limit:20},
            apiGetTracking:{page:1,limit:20},
            apiGetPeoplePageBundle:{page:1,limit:100},
            apiGetPetitioners:{page:1,limit:100},
            apiBudgetGetSummary:{page:1,limit:100,pageSize:100}
          };
          for(const [method,payload] of Object.entries(probes)){
            fs.writeFileSync(path.join(process.env.P7_DIR,method+'.request.json'),JSON.stringify({
              method:'apiRouter',
              payload:{method,payload:{...common,...payload,source:'github-actions-p7-data-pipeline'}},
              timeoutMs:90000
            }));
          }
          NODE

            for p7_method in apiGetDashboardBundle apiSearchCasesLite apiGetCommitteeMeetingSystem apiGetTracking apiGetPeoplePageBundle apiGetPetitioners apiBudgetGetSummary; do
              p7_code="$(curl --max-time 105 --retry 1 --retry-delay 2 --retry-all-errors -sS \
                -D "$auth_dir/p7/$p7_method.headers.txt" -o "$auth_dir/p7/$p7_method.body.json" -w '%{http_code}' \
                -H 'Content-Type: application/json' \
                -H "Origin: $edge_origin" \
                --data-binary "@$auth_dir/p7/$p7_method.request.json" \
                "$edge_origin/api/router" || true)"
              test "$p7_code" = "200" || { echo "P7 $p7_method read failed (HTTP $p7_code)" >&2; exit 1; }
              P7_BODY="$auth_dir/p7/$p7_method.body.json" P7_HEADERS="$auth_dir/p7/$p7_method.headers.txt" P7_ORIGIN="$edge_origin" P7_METHOD="$p7_method" node <<'NODE'
          const fs=require('fs');
          const body=JSON.parse(fs.readFileSync(process.env.P7_BODY,'utf8'));
          const headers=fs.readFileSync(process.env.P7_HEADERS,'utf8').split(/\r?\n/);
          const get=name=>{
            const prefix=name.toLowerCase()+':';
            const line=headers.find(x=>x.toLowerCase().startsWith(prefix));
            return line?line.slice(line.indexOf(':')+1).trim():'';
          };
          if(get('x-gas-response-contract')!=='gas-direct-json-v1') process.exit(1);
          if(get('x-p0f-edge')!=='cloudflare-workers-dev') process.exit(1);
          if(get('access-control-allow-origin')!==process.env.P7_ORIGIN) process.exit(1);
          if(body?.transportOk!==true||!Object.prototype.hasOwnProperty.call(body,'result')) process.exit(1);
          const result=body.result;
          if(result&&typeof result==='object'&&result.ok===false) process.exit(1);
          if(result===null||result===undefined) process.exit(1);
          NODE
            done

            echo "### P7 Read Data Pipeline Gate" >> "$GITHUB_STEP_SUMMARY"
            echo "- Dashboard read: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- Case search read: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- Committee meeting read: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- Tracking read: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- People read: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- Petitioner read: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- Budget summary read: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- Public edge → Cloud Run → GAS read contract: PASS" >> "$GITHUB_STEP_SUMMARY"

            rm -rf "$auth_dir"
            echo "P2 auth smoke: PASS"
            echo "P3 login/session/Dashboard contract: PASS"
            echo "- Authenticated apiLogin → apiSessionCheck: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "### P3 Login / Session / Dashboard Boot Contract Gate" >> "$GITHUB_STEP_SUMMARY"
            echo "- apiLogin contract: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- apiSessionCheck contract: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- Scripts_Page_Dashboard authenticated controller fetch: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- apiGetDashboardBundle authenticated data fetch: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "### P11 Production Deployment Quality Gate" >> "$GITHUB_STEP_SUMMARY"
            echo "- Required Cloudflare credentials: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- Required authenticated E2E credentials: PASS" >> "$GITHUB_STEP_SUMMARY"
            echo "- Login → session → Dashboard → P7 reads: PASS" >> "$GITHUB_STEP_SUMMARY"

          rm -rf "$p2_rpc_dir"

          edge_config=""
          for attempt in 1 2 3; do
            if candidate="$(curl --max-time 30 --retry 2 --retry-delay 2 --retry-all-errors -fsS "$edge_origin/app-config.js")"; then
              edge_config="$candidate"
              break
            fi
            test "$attempt" -lt 3 && sleep 2
          done
          test -n "$edge_config" || { echo "P0-F-B1 edge app-config unavailable" >&2; exit 1; }
          edge_index_tmp="$(mktemp)"
          curl --max-time 45 --retry 2 --retry-delay 2 --retry-all-errors -fsS "$edge_origin/" -o "$edge_index_tmp"
          grep -q 'dashboard-initial-data-gate-p4' "$edge_index_tmp"
          grep -q 'auth.dashboardDataReady' "$edge_index_tmp"
          grep -q 'critical-login-runtime-p4' "$edge_index_tmp"
          grep -q 'dashboard-data-recovery-p5' "$edge_index_tmp"
          grep -q 'recoveryState.reset("login-dashboard-bootstrap")' "$edge_index_tmp"
          grep -q 'rotationRetry=/SESSION_TOKEN_ROTATED_RETRY' "$edge_index_tmp"
          grep -q 'function syncAuthPayloadCrit' "$edge_index_tmp"
          grep -q 'function resetActionAuthCrit' "$edge_index_tmp"
          grep -q 'nextSessionToken' "$edge_index_tmp"
          grep -q 'nextCsrfToken' "$edge_index_tmp"
          grep -q 'app-production-measurement-gate-current' "$edge_index_tmp"
          grep -q 'RUN_PERFORMANCE_BASELINE' "$edge_index_tmp"
          grep -q 'm10-dependency-performance-baseline-r330' "$edge_index_tmp"
          grep -q '__APP_SINGLE_EVENT_DELEGATION__' "$edge_index_tmp"
          grep -q '__APP_SINGLE_CHANGE_DELEGATION__' "$edge_index_tmp"
          grep -q 'data-mobile-nav-owner' "$edge_index_tmp"
          grep -q '__APP_SIDEBAR_NAV_CLICK_OWNER__' "$edge_index_tmp"
          grep -q 'AppPrint.printWithProfile' "$edge_index_tmp"
          grep -q 'APP_CLOUD_RUN_TRANSPORT_REQUIRED' "$edge_index_tmp"
          if grep -q 'google.script.run' "$edge_index_tmp"; then echo "P12 edge failed: retired browser GAS fallback returned" >&2; exit 1; fi
          if grep -q 'AppTransport.run=root2.AppTransport.run||' "$edge_index_tmp"; then echo "P12 edge failed: duplicate AppTransport fallback owner returned" >&2; exit 1; fi
          if grep -q 'app-login-dashboard-autostart-current' "$edge_index_tmp"; then echo "P4 edge failed: duplicate Dashboard autostart owner is still public" >&2; exit 1; fi
          printf '%s' "$edge_config" | grep -q 'p0-f-edge-ready-20260922'
          if printf '%s' "$edge_config" | grep -q '\.run\.app'; then
            echo "P0-F-B1 failed: public browser config exposes run.app" >&2
            exit 1
          fi

          edge_meeting_tmp="$(mktemp)"
          edge_meeting_ok=false
          for attempt in 1 2 3 4 5; do
            if curl --max-time 45 --retry 2 --retry-delay 2 --retry-all-errors -fsS "$edge_origin/meeting-controller.html" -o "$edge_meeting_tmp" \
              && grep -q 'window.initMeetingPage' "$edge_meeting_tmp" \
              && grep -q 'AppPages.register("meeting"' "$edge_meeting_tmp"; then
              edge_meeting_ok=true
              break
            fi
            test "$attempt" -lt 5 && sleep 3
          done
          test "$edge_meeting_ok" = "true" || { echo "P0-F-B1 Meeting controller unavailable or invalid at edge" >&2; exit 1; }

          echo "### P0-F-B1 Cloudflare Edge" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Public URL: $edge_origin" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workers → Cloud Run source SHA: $GITHUB_SHA (MATCH)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Cloud Run revision attestation: PRESENT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Browser → Cloudflare → Cloud Run → GAS Direct JSON" >> "$GITHUB_STEP_SUMMARY"
          echo "- P4 Dashboard bootstrap source at public edge: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- P5 Dashboard recovery single-owner source at public edge: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- P6 rotated-session write stability source at public edge: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- P9 production measurement owner at public edge: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- P9 performance baseline remains explicit/manual: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- P10 canonical action/mobile/print owners at public edge: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- P12 direct-only frontend cleanup at public edge: PASS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Preview URLs: disabled" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove CR-8 canary
        if: always()
        run: |
          gcloud run services delete "$CANARY_SERVICE" --project "$PROJECT_ID" --region "$REGION" --quiet || true
