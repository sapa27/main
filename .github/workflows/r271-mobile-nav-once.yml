name: Apply r271 Mobile Navigation Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r271-mobile-nav-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch mobile navigation click contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('github-pages/index.html')
          s=p.read_text(encoding='utf-8')
          old='return window.PointerEvent?(document.addEventListener("pointerup",handle,!0),document.addEventListener("click",function(ev){return ev&&Number(ev.detail||0)>0?!0:handle(ev)},!0)):(document.addEventListener("click",handle,!0),document.addEventListener("touchend",handle,{capture:!0,passive:!1})),!0}'
          new='document.addEventListener("click",handle,!0);window.PointerEvent?document.addEventListener("pointerup",function(ev){return!ev||String(ev.pointerType||"")==="mouse"?!0:handle(ev)},!0):document.addEventListener("touchend",handle,{capture:!0,passive:!1});try{document.documentElement.setAttribute("data-mobile-nav-owner","r271-click-primary")}catch(_mobileNavOwnerAttr){__appObserve(_mobileNavOwnerAttr,"nav.mobile.owner")}return!0}'
          if old not in s:
              raise SystemExit('r270 mobile navigation binding not found')
          s=s.replace(old,new,1)
          s=s.replace('owner:"Index.sidebar-nav-production-rewrite"','owner:"Index.sidebar-nav-production-r271-click-primary"',1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'data-mobile-nav-owner","r271-click-primary' github-pages/index.html
          ! grep -q 'Number(ev.detail||0)>0?!0:handle(ev)' github-pages/index.html
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/index.html
          git commit -m "fix: mobile sidebar navigation click-primary r271"
          git push origin HEAD:main
