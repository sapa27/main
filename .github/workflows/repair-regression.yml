name: Repair Direct GAS Regression Contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-regression.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align regression contract with direct GAS production
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/tests/regression.mjs')
          s = p.read_text()
          reps = [
            ("const GAS_BACKEND_DIR = path.join(ROOT,'gas-backend');\n", "const GAS_BACKEND_DIR = path.join(ROOT,'gas-backend');\nconst FULL_GAS_BACKEND_MARKER = path.join(GAS_BACKEND_DIR,'Code_00_PlatformCore.gs');\nconst HAS_FULL_GAS_BACKEND = fs.existsSync(FULL_GAS_BACKEND_MARKER);\n"),
            ("const MODE = requestedModes[0] ? requestedModes[0].slice(2) : (fs.existsSync(GAS_BACKEND_DIR)?'full':'frontend-only');", "const MODE = requestedModes[0] ? requestedModes[0].slice(2) : (HAS_FULL_GAS_BACKEND?'full':'frontend-only');"),
            ("assert.ok(workflow.includes('if [ -d gas-backend ]; then'));", "assert.ok(workflow.includes('if [ -f gas-backend/Code_00_PlatformCore.gs ]; then'));"),
            ("  const hasGasBackend=fs.existsSync(GAS_BACKEND_DIR);\n  if(MODE==='full')assert.ok(hasGasBackend,'--full regression requires gas-backend source');\n  else assert.ok(!hasGasBackend,'--frontend-only regression must not contain gas-backend source');", "  if(MODE==='full')assert.ok(HAS_FULL_GAS_BACKEND,'--full regression requires canonical Code_00_PlatformCore.gs');\n  else assert.ok(!HAS_FULL_GAS_BACKEND,'--frontend-only is reserved for frontend or partial GAS patch sets');"),
            ("assert.ok(config.includes('RPC_RESULT_JSONP_TIMEOUT_MS:7000'));", "assert.ok(config.includes('RPC_RESULT_JSONP_TIMEOUT_MS:30000'));"),
          ]
          for old, new in reps:
            if old not in s:
              raise SystemExit('expected regression marker missing: ' + old[:100])
            s = s.replace(old, new, 1)
          marker = "\n\nfunction scriptBlockById(html,id){"
          if 'partial Meeting patch preserves native timer fallback' not in s:
            block = '''\n\nok('partial Meeting patch preserves native timer fallback and visible-reactivation lookup hydration',()=>{\n  const meetingPath=path.join(GAS_BACKEND_DIR,'Scripts_Page_Meeting.html');\n  if(!fs.existsSync(meetingPath))return;\n  const meeting=fs.readFileSync(meetingPath,'utf8');\n  htmlScripts(meeting).forEach((src,i)=>jsSyntax(src,`Scripts_Page_Meeting.html#${i+1}`));\n  assert.ok(meeting.includes('meetingRoot.setTimeout(n, o)'),'Meeting delay fallback must schedule with native setTimeout');\n  assert.ok(meeting.includes('page:meeting.lookup-options.reactivate'),'Meeting visible reactivation must retry lookup hydration');\n  assert.ok(meeting.includes('meetingStoreGet("auth.user", null)'),'Meeting admin tools must prefer canonical auth.user');\n  assert.ok(meeting.includes('meetingStoreGet("auth.role", "")'),'Meeting admin tools must honor canonical auth.role');\n});\n'''
            if marker not in s:
              raise SystemExit('scriptBlockById insertion marker missing')
            s = s.replace(marker, block + marker, 1)
          p.write_text(s)
          PY
          node .github/tests/regression.mjs --frontend-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/tests/regression.mjs
          git commit -m "Align regression with direct GAS production"
          git push
