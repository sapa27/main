name: Migrate Canonical GAS Upstream

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type MIGRATE to update the canonical GAS upstream configuration'
        required: true
        type: string
        default: 'MIGRATE'

permissions:
  contents: write
  actions: write

concurrency:
  group: migrate-canonical-gas-upstream
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ inputs.confirm == 'MIGRATE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEW_GAS_WEB_APP_URL: https://script.google.com/macros/s/AKfycbw3o5OzTcls7MUpE0dQY5g6WCL7GHP8sO4UPZYYX-3tw5fSc25AYkCvnBLBb7DnyXug/exec
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate target and GAS URL
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "main" || {
            echo "This migration must run on main." >&2
            exit 1
          }
          python - <<'PY'
          import os, re
          url = os.environ["NEW_GAS_WEB_APP_URL"].strip()
          if not re.fullmatch(r"https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec", url):
              raise SystemExit("Invalid GAS Web App URL")
          print("GAS URL contract: OK")
          PY

      - name: Set repository GAS_WEB_APP_URL variable
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh variable set GAS_WEB_APP_URL --body "$NEW_GAS_WEB_APP_URL"
          value="$(gh variable get GAS_WEB_APP_URL)"
          test "$value" = "$NEW_GAS_WEB_APP_URL" || {
            echo "Repository variable verification failed." >&2
            exit 1
          }

      - name: Convert deployment workflows to one GAS upstream owner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          workflows = [
              Path(".github/workflows/cloud-run-gateway.yml"),
              Path(".github/workflows/v2-canary.yml"),
              Path(".github/workflows/v2-cloud-run-canary.yml"),
              Path(".github/workflows/v2-promote-production.yml"),
          ]
          env_ref = "GAS_WEB_APP_URL: $" + "{{ vars.GAS_WEB_APP_URL }}"

          for path in workflows:
              if not path.exists():
                  raise SystemExit(f"Missing required workflow: {path}")
              src = path.read_text(encoding="utf-8")
              pattern = re.compile(
                  r"(?m)^(\s*)GAS_WEB_APP_URL:\s*"
                  r"https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec\s*$"
              )
              dst, count = pattern.subn(lambda m: m.group(1) + env_ref, src)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected exactly 1 primary GAS_WEB_APP_URL literal, found {count}"
                  )
              path.write_text(dst, encoding="utf-8")
              print(f"updated {path}")

          regression = Path(".github/tests/regression.mjs")
          src = regression.read_text(encoding="utf-8")
          const_pattern = re.compile(
              r"(?m)^const CANONICAL_GAS_WEB_APP_URL="
              r"'https://script\.google\.com/macros/s/[A-Za-z0-9_-]+/exec';$"
          )
          replacement = (
              "const CANONICAL_GAS_ENV_REF="
              "'GAS_WEB_APP_URL: $'+'{{ vars.GAS_WEB_APP_URL }}';"
          )
          src, const_count = const_pattern.subn(replacement, src)
          if const_count != 1:
              raise SystemExit(
                  f"regression.mjs: expected 1 canonical GAS URL constant, found {const_count}"
              )

          old_assert = (
              "wf.includes('GAS_WEB_APP_URL: '+CANONICAL_GAS_WEB_APP_URL)"
          )
          new_assert = "wf.includes(CANONICAL_GAS_ENV_REF)"
          if src.count(old_assert) != 1:
              raise SystemExit(
                  "regression.mjs: canonical workflow assertion not found exactly once"
              )
          src = src.replace(old_assert, new_assert)
          regression.write_text(src, encoding="utf-8")
          print("updated .github/tests/regression.mjs")
          PY

      - name: Static contract verification
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .github/workflows/cloud-run-gateway.yml
            .github/workflows/v2-canary.yml
            .github/workflows/v2-cloud-run-canary.yml
            .github/workflows/v2-promote-production.yml
          )

          for file in "${files[@]}"; do
            count="$(grep -F -c 'GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}' "$file" || true)"
            test "$count" = "1" || {
              echo "$file does not have exactly one canonical GAS_WEB_APP_URL variable reference." >&2
              exit 1
            }
            if grep -Eq '^[[:space:]]*GAS_WEB_APP_URL:[[:space:]]+https://script\.google\.com/macros/s/' "$file"; then
              echo "$file still contains a hard-coded primary GAS endpoint." >&2
              exit 1
            fi
          done

          grep -Fq "CANONICAL_GAS_ENV_REF" .github/tests/regression.mjs
          ! grep -Fq "const CANONICAL_GAS_WEB_APP_URL=" .github/tests/regression.mjs

      - name: Stage production frontend for gateway validation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cloud-run-gateway/public
          cp -R frontend cloud-run-gateway/public
          test -f cloud-run-gateway/public/index.html
          test -f cloud-run-gateway/public/app-config.js
          test -f cloud-run-gateway/public/cloud-run-transport.js
          test -f cloud-run-gateway/public/meeting-controller.html

      - name: Run frontend regression gate
        run: node .github/tests/regression.mjs --frontend-only

      - name: Run Cloud Run gateway syntax and tests
        shell: bash
        run: |
          set -euo pipefail
          cd cloud-run-gateway
          npm run check
          npm test

      - name: Validate container build
        run: docker build --file cloud-run-gateway/Dockerfile cloud-run-gateway

      - name: Remove staged frontend and one-time migration workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -rf cloud-run-gateway/public
          rm -f .github/workflows/migrate-gas-upstream.yml

      - name: Commit verified migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            .github/workflows/cloud-run-gateway.yml \
            .github/workflows/v2-canary.yml \
            .github/workflows/v2-cloud-run-canary.yml \
            .github/workflows/v2-promote-production.yml \
            .github/tests/regression.mjs \
            .github/workflows/migrate-gas-upstream.yml

          git diff --cached --check
          git diff --cached --quiet && {
            echo "No migration changes were produced." >&2
            exit 1
          }

          git commit -m "chore: canonicalize GAS upstream configuration"
          git push origin HEAD:main

      - name: Next action
        run: |
          echo "Migration completed."
          echo "Now run the existing 'Cloud Run Production' workflow manually with deploy=true."
          echo "After deployment verify /ready, /version, /network-health and /upstream-health."
