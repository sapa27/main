name: Validate and Deploy GitHub Pages
# Canonical production transport: GitHub Pages -> GAS Web App directly.
# Quota guard: PRs run static regression only; live GAS smoke/deploy run on main/manual.

on:
  pull_request:
    branches: [main]
    paths:
      - 'github-pages/**'
      - 'gas-backend/**'
      - '.github/tests/regression.mjs'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - 'gas-backend/**'
      - '.github/tests/regression.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run R331/v62 automated regression suite
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gas-backend/Code_00_PlatformCore.gs ]; then
            node .github/tests/regression.mjs --full
          else
            node .github/tests/regression.mjs --frontend-only
          fi

      - name: Validate live GAS RPC health contract
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          node <<'NODE'
          const fs = await import('node:fs');
          const cfg = fs.readFileSync('github-pages/app-config.js','utf8');
          const gas = (cfg.match(/GAS_URL="([^"]+)"/)||[])[1];
          const rpc = (cfg.match(/(?:RPC_VERSION|RV)="([^"]+)"/)||[])[1];
          if (!gas || !rpc) throw new Error('canonical GAS/RPC config missing');
          const callback = '__ghRpcCb_cihealth123';
          async function fetchHealth() {
            let lastError;
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              const url = new URL(gas);
              url.searchParams.set('mode','github-rpc-health');
              url.searchParams.set('parentOrigin','https://sapa27.github.io');
              url.searchParams.set('rpcVersion',rpc);
              url.searchParams.set('callback',callback);
              url.searchParams.set('_ts',Date.now().toString(36)+'-'+attempt);
              try {
                const response = await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(45000)});
                if (!response.ok) throw new Error('GAS health HTTP '+response.status);
                const text = await response.text();
                const prefix = '/**/'+callback+'(';
                if (!text.startsWith(prefix) || !text.endsWith(');')) throw new Error('invalid GAS health JSONP');
                return JSON.parse(text.slice(prefix.length,-2));
              } catch (error) {
                lastError = error;
                console.warn('GAS health attempt '+attempt+' failed:',error && error.message || error);
                if (attempt < 3) await new Promise(resolve=>setTimeout(resolve,attempt*1500));
              }
            }
            throw lastError || new Error('GAS health unavailable');
          }
          const payload = await fetchHealth();
          if (payload.ok !== true || payload.allowedOrigin !== true) throw new Error('GAS origin health denied');
          if (payload.transportVersion !== rpc) throw new Error('GAS RPC version mismatch');
          console.log('GAS RPC health ok:',payload.transportVersion);
          NODE

      - name: Validate live GAS apiRouter round trip
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          node <<'NODE'
          const fs = await import('node:fs');
          const { randomUUID } = await import('node:crypto');
          const cfg = fs.readFileSync('github-pages/app-config.js','utf8');
          const gas = (cfg.match(/GAS_URL="([^"]+)"/)||[])[1];
          const rpc = (cfg.match(/(?:RPC_VERSION|RV)="([^"]+)"/)||[])[1];
          if (!gas || !rpc) throw new Error('canonical GAS/RPC config missing');
          const rpcId='req_ci_'+randomUUID().replaceAll('-','');
          const rpcToken='tok_ci_'+randomUUID().replaceAll('-','');
          const callback='__ghRpcCb_ciroundtrip1234';
          const body=new URLSearchParams({mode:'github-rpc',parentOrigin:'https://sapa27.github.io',rpcVersion:rpc,rpcId,rpcToken,rpcFunction:'apiRouter',rpcPayload:JSON.stringify({method:'apiSessionCheck',payload:{}}),traceId:'trace_ci_'+randomUUID().replaceAll('-',''),clientStartedAt:new Date().toISOString()});
          const post=await fetch(gas,{method:'POST',redirect:'follow',body,signal:AbortSignal.timeout(45000)});
          if(!post.ok) throw new Error('GAS apiRouter POST HTTP '+post.status);
          const deadline=Date.now()+90000;
          let payload=null,lastError=null,attempt=0;
          while(Date.now()<deadline){
            attempt++;
            const url=new URL(gas);
            for(const [k,v] of Object.entries({mode:'github-rpc-result',parentOrigin:'https://sapa27.github.io',rpcVersion:rpc,rpcId,rpcToken,callback,_ts:Date.now().toString(36)+'-'+attempt})) url.searchParams.set(k,v);
            try{
              const response=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(30000)});
              if(!response.ok) throw new Error('GAS apiRouter result HTTP '+response.status);
              const text=await response.text(),prefix='/**/'+callback+'(';
              if(!text.startsWith(prefix)||!text.endsWith(');')) throw new Error('invalid GAS apiRouter JSONP');
              payload=JSON.parse(text.slice(prefix.length,-2));
              if(payload.pending!==true) break;
              lastError=null;
            }catch(error){lastError=error;console.warn('GAS apiRouter result attempt '+attempt+' failed:',error&&error.message||error)}
            if(Date.now()<deadline) await new Promise(resolve=>setTimeout(resolve,Math.min(2000,500+attempt*250)));
          }
          if(!payload||payload.pending===true) throw new Error('GAS apiRouter round trip timeout'+(lastError?': '+(lastError.message||lastError):''));
          if(payload.transportOk!==true||!payload.result||payload.result.ok!==true) throw new Error('GAS apiRouter round trip failed: '+JSON.stringify(payload&&payload.error||payload));
          console.log('GAS apiRouter round trip ok');
          NODE

      - name: Validate live Meeting JSONP transport contract
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          node <<'NODE'
          const fs = await import('node:fs');
          const { randomUUID } = await import('node:crypto');
          const cfg=fs.readFileSync('github-pages/app-config.js','utf8');
          const gas=(cfg.match(/GAS_URL="([^"]+)"/)||[])[1];
          const rpc=(cfg.match(/(?:RPC_VERSION|RV)="([^"]+)"/)||[])[1];
          if(!gas||!rpc) throw new Error('GAS/RPC config missing');
          const rpcId='req_meeting_contract_'+randomUUID().replaceAll('-','');
          const rpcToken='tok_meeting_contract_'+randomUUID().replaceAll('-','');
          const callback='__ghRpcCb_meetingContractSmoke1234';
          const body=new URLSearchParams({mode:'github-rpc',parentOrigin:'https://sapa27.github.io',rpcVersion:rpc,rpcId,rpcToken,rpcFunction:'apiRouter',rpcPayload:JSON.stringify({method:'apiGetRouteContract',payload:{}}),traceId:'trace_'+randomUUID().replaceAll('-',''),clientStartedAt:new Date().toISOString()});
          const post=await fetch(gas,{method:'POST',redirect:'follow',body,signal:AbortSignal.timeout(45000)});
          if(!post.ok) throw new Error('POST HTTP '+post.status);
          const deadline=Date.now()+120000;
          let envelope=null,lastError=null,attempt=0;
          while(Date.now()<deadline){
            attempt++;
            const url=new URL(gas);
            for(const [k,v] of Object.entries({mode:'github-rpc-result',parentOrigin:'https://sapa27.github.io',rpcVersion:rpc,rpcId,rpcToken,callback,_ts:Date.now().toString(36)+'-'+attempt})) url.searchParams.set(k,v);
            try{
              const response=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(45000)});
              if(!response.ok) throw new Error('result HTTP '+response.status);
              const text=await response.text(),prefix='/**/'+callback+'(';
              if(!text.startsWith(prefix)||!text.endsWith(');')) throw new Error('invalid JSONP');
              envelope=JSON.parse(text.slice(prefix.length,-2));
              if(envelope.pending!==true) break;
              lastError=null;
            }catch(error){lastError=error;console.warn('Meeting result attempt '+attempt+' failed:',error&&error.message||error)}
            if(Date.now()<deadline) await new Promise(resolve=>setTimeout(resolve,Math.min(2500,750+attempt*250)));
          }
          if(!envelope||envelope.pending===true) throw new Error('Meeting JSONP result timeout'+(lastError?': '+(lastError.message||lastError):''));
          if(envelope.transportOk!==true) throw new Error('Meeting JSONP transport failed '+JSON.stringify(envelope.error||envelope));
          if(envelope.transportVersion&&envelope.transportVersion!==rpc) throw new Error('Meeting JSONP transport version mismatch');
          const result=envelope.result;
          if(!result) throw new Error('Meeting JSONP application envelope missing');
          if(result.ok===true){
            const contract=result.data||result,routes=contract.routes||{},allowed=new Set(contract.allowedMethods||contract.activeAllowedMethods||Object.keys(routes));
            const required=['apiSearchCasesLite','apiGetCanonicalCaseBundle','apiGetMeetingLookupOptions','apiGetMeetingHistory','apiListCommitteeMeetings','apiGetCommitteeMeetingSystem','apiGetCommitteeMeetingSystemSpec','apiSearchMeetingAgendaCases','apiGetCommitteeMeetingPrintBundle','apiGetLetters','apiGetPetitioners','apiSaveCase','apiDeleteCase','apiSaveMeetingLog','apiDeleteMeetingLog','apiSaveLetter','apiDeleteLetter','apiSaveCommitteeMeetingSystem','apiDeleteCommitteeMeetingSystem'];
            const missing=required.filter(m=>!allowed.has(m)&&!routes[m]);
            if(missing.length) throw new Error('live Meeting routes missing: '+missing.join(','));
            console.log('LIVE MEETING ROUTE CONTRACT PASS',required.length,'routes; rpc',rpc);
          } else if(result.errorCode==='AUTH_REQUIRED'&&result.method==='apiGetRouteContract') {
            console.log('LIVE MEETING JSONP TRANSPORT PASS; AUTH_REQUIRED expected; rpc',rpc);
          } else throw new Error('unexpected Meeting application result '+JSON.stringify(result));
          NODE

  deploy:
    needs: regression
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Validate deployed Pages release surface
        shell: bash
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          node <<'NODE'
          const base=String(process.env.PAGES_URL||'').trim();
          if(!/^https:\/\//.test(base)) throw new Error('Pages deployment URL missing');
          const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function fetchReady(url,label){
            let lastError;
            for(let attempt=1;attempt<=5;attempt++){
              try{
                const response=await fetch(url,{redirect:'follow',cache:'no-store',signal:AbortSignal.timeout(30000)});
                if(!response.ok) throw new Error(label+' HTTP '+response.status);
                return await response.text();
              }catch(error){lastError=error;console.warn(label+' attempt '+attempt+' failed:',error&&error.message||error);if(attempt<5)await sleep(attempt*1500)}
            }
            throw lastError||new Error(label+' unavailable');
          }
          const indexUrl=new URL('./',base).href;
          const [html,cfg,transport]=await Promise.all([fetchReady(indexUrl,'Pages index'),fetchReady(new URL('app-config.js',indexUrl).href,'Pages config'),fetchReady(new URL('github-gas-transport.js',indexUrl).href,'Pages transport')]);
          for(const marker of ['CANONICAL GITHUB FRONTEND r331-v62','app-production-measurement-gate-current','app-production-quality-gate-f5-r330','app:route-settled']) if(!html.includes(marker)) throw new Error('deployed index missing '+marker);
          for(const marker of ['commission-v1.2-reliability-loading-cache-session-2026-09-02-r331-v62','asset-manifest-r331-v62-reliability','gas-backend-single-source-r331-v62','github-pages-rpc-r330','github-pages-canonical-projection-r331-v62-directgas-p1-20260916']) if(!cfg.includes(marker)) throw new Error('deployed config missing '+marker);
          const expectedGas='https://script.google.com/macros/s/AKfycbwXIRMjP4yKRRlS7loJFiAmVCLxKq_uie6rUPsaKw17wtzWQOkjjaH2ah8gIqsHA6_G/exec';
          if(!cfg.includes('GAS_URL="'+expectedGas+'"')) throw new Error('deployed GAS endpoint mismatch');
          if(!transport.includes('github-gas-transport.js::frontend-r331-v62::rpc-r330')) throw new Error('deployed transport revision mismatch');
          console.log('Pages post-deploy release surface ok:',indexUrl);
          NODE
