name: Deploy GitHub Pages

# Canonical source = deploy artifact. r302 aligns GitHub with the GAS r301 PDF finalize backend.
on:
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical frontend r302
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(find github-pages -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          test -f github-pages/index.html
          test -f github-pages/app-config.js
          test -f github-pages/github-gas-transport.js

          grep -q 'CANONICAL GITHUB FRONTEND r302' github-pages/index.html
          grep -q 'app-config.js?v=r302' github-pages/index.html
          grep -q 'github-gas-transport.js?v=r302' github-pages/index.html
          grep -q 'github-deferred-r302' github-pages/index.html
          grep -q 'htmlCache\[cacheKey\]' github-pages/index.html
          grep -q 'assetVersion:v' github-pages/index.html
          grep -q 'deferredAssetVersion:v' github-pages/index.html

          test "$(grep -o 'id="meeting-add-petitioner-btn"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="github-commissioner-proposer-owner-r297"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="github-ai-duplicate-model-fallback-r299"' github-pages/index.html | wc -l | tr -d ' ')" = "1"

          grep -q 'version:"1.2.0-r302"' github-pages/app-config.js
          grep -q 'backendFeatureBaseline:"gas-r301-ai-pdf-finalize"' github-pages/app-config.js
          grep -q 'githubPdfRuntimeBaseline:"Runtime_08_AI_Bridge.html::r301"' github-pages/app-config.js
          grep -q 'githubPdfTransferMode:"client-chunk+gas-finalize"' github-pages/app-config.js
          grep -q 'AKfycbwFGY4RIsqW6gOxIrn4t1jjlFKESHWmJyB-HEoCtLZjZi0_7c8OmJLO4uXK3S3_ph-b' github-pages/app-config.js
          ! grep -q 'AKfycbxu2K3ukqReIC8wCalO7P3NRrySO3JUVDoE3d4P0oEzknHehos1u7sCPeeYkashRzgV' github-pages/app-config.js
          grep -q 'DEFERRED_ASSET_VERSION:ASSET_VERSION' github-pages/app-config.js
          grep -q 'DEFERRED_ASSET_FORCE_FRESH:true' github-pages/app-config.js
          grep -q 'clientInFlightOwner:"github-pages/github-gas-transport.js::canonical"' github-pages/app-config.js
          grep -q 'github-pages/github-gas-transport.js::canonical' github-pages/github-gas-transport.js

          ! grep -q 'CANONICAL GITHUB FRONTEND r299' github-pages/index.html
          ! grep -q 'github-deferred-r299' github-pages/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
