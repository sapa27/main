name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production runtime R329 P1-F
        shell: bash
        run: |
          set -euo pipefail
          test "$(find github-pages -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          test -f github-pages/index.html
          test -f github-pages/app-config.js
          test -f github-pages/github-gas-transport.js

          grep -q 'commission-v1.2-p1f-contract-guard-consolidation-2026-08-20-r329' github-pages/index.html
          grep -q 'asset-manifest-r329-contract-guard-consolidation' github-pages/index.html
          grep -q 'current-quality-gate-r329' github-pages/index.html
          grep -q 'app-config.js?v=r329' github-pages/index.html
          grep -q 'github-gas-transport.js?v=r329' github-pages/index.html
          grep -q 'github-pages-rpc-r329' github-pages/app-config.js
          grep -q 'github-pages-gas-router-rpc-only' github-pages/app-config.js
          grep -q 'DEFERRED_ASSET_FORCE_FRESH:false' github-pages/app-config.js
          if grep -Eq 'Scripts_Page_ReportTrack::(search|track|report)|"Scripts_Page_Meeting":"Staff"' github-pages/index.html; then
            echo 'FORBIDDEN: retired deferred permission alias returned' >&2
            exit 1
          fi
          grep -q 'sha512-r22gChDnGvBylk90+2e/ycr3RVrDi8DIOkIGNhJlKfuyQM4tIRAI062MaV8sfjQKYVGjOBaZBOA87z+IhZE9DA==' github-pages/index.html
          ! grep -q 'sha512-r329gCh' github-pages/index.html
          if grep -Eq 'typeof[[:space:]]+(root\.)?__appObserve[[:space:]]*(==|===)|"function"[[:space:]]*(==|===)[[:space:]]*typeof[[:space:]]+(root\.)?__appObserve' github-pages/index.html; then
            echo 'FORBIDDEN: redundant __appObserve function guard returned' >&2
            exit 1
          fi

          grep -q 'w.AppTransport.run=run' github-pages/github-gas-transport.js
          grep -q 'w.AppTransport.invalidateClientApiCache=' github-pages/github-gas-transport.js
          if grep -Eq 'iframe|createElement\("form"\)|MessageChannel|legacyRemote|runGasDirectBridge|runVercelProxy|runJsonpApi|runLoginPost|ensureBridgeClient|warmAuthBridge|resetBridge|RPC_POST_SIGNAL_GRACE' github-pages/github-gas-transport.js; then
            echo 'FORBIDDEN: retired transport compatibility surface returned' >&2
            exit 1
          fi

          python - <<'PY'
          import pathlib,re,sys
          files=list(pathlib.Path('github-pages').glob('*'))+[pathlib.Path('.github/workflows/pages.yml')]
          stale=[]
          for p in files:
              if not p.is_file():
                  continue
              s=p.read_text(errors='ignore')
              s=re.sub(r'(?i)(?:sha256|sha384|sha512)-[A-Za-z0-9+/=]+','<HASH>',s)
              for token in re.findall(r'(?i)r\d{2,3}',s):
                  if token.lower()!='r329':
                      stale.append((str(p),token))
          if stale:
              print('stale revisions:',stale,file=sys.stderr)
              sys.exit(1)
          PY

          node --check github-pages/app-config.js
          node --check github-pages/github-gas-transport.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
