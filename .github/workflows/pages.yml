name: P0-D1 Promote Reduced Shell

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  promote-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote P0-D1 reduced shell
        shell: bash
        env:
          P0D1_PATCH_B64: 
        run: |
          set -euo pipefail
          echo '681f2c57fa18f9f3e2b812c2decebd0a0a181589bd90853e6af3e03de6b79351  github-pages/index.html' | sha256sum -c -
          command -v zstd >/dev/null
          printf '%s' "$P0D1_PATCH_B64" | base64 -d > /tmp/p0d1-index.zstpatch
          echo '9dbf9a3e34467982efda36a2bcb234f0527392990a3fd5bd41e99023d08bba47  /tmp/p0d1-index.zstpatch' | sha256sum -c -
          zstd -d --patch-from=github-pages/index.html /tmp/p0d1-index.zstpatch -o /tmp/p0d1-index.html
          echo '3f0a1185a3ac456d3b03c20f2ad957cfa210cfff1c165a84f45ba551946bbeb3  /tmp/p0d1-index.html' | sha256sum -c -
          test "$(wc -c < /tmp/p0d1-index.html | tr -d ' ')" = '331788'
          mv /tmp/p0d1-index.html github-pages/index.html

          python3 - <<'PY'
          from pathlib import Path
          p=Path('github-pages/app-config.js')
          s=p.read_text(encoding='utf-8')
          replacements={
            'commission-github-p1b-dashboard-swr-2026-08-19':'commission-github-p0d1-shell-converged-2026-08-19',
            'version:"1.3.1-p1b-dashboard-swr"':'version:"1.3.2-p0d1-shell-converged"',
            'backendFeatureBaseline:"p1a-deferred-shell+p1b-dashboard-swr"':'backendFeatureBaseline:"p0d1-reduced-shell+p1b-dashboard-swr"',
            'criticalShellOwner:"github-pages/index.html::p1a-r313"':'criticalShellOwner:"github-pages/index.html::p0d1-r315"',
          }
          for old,new in replacements.items():
              if s.count(old)!=1:
                  raise SystemExit(f'expected exactly one config marker: {old!r}; found {s.count(old)}')
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY

          echo 'd822f99a3c0cf28fc33be620cfb90b954e65d0936713c355090b1bbf7a5009b4  github-pages/app-config.js' | sha256sum -c -
          grep -q 'CANONICAL GITHUB FRONTEND p0d1-r315' github-pages/index.html
          grep -q 'app-config.js?v=p0d1-r315' github-pages/index.html
          grep -q 'github-gas-transport.js?v=p0d1-r315' github-pages/index.html
          grep -q 'version:"1.3.2-p0d1-shell-converged"' github-pages/app-config.js
          grep -q 'AKfycbzURC6h2tp4DN8JIFA-dDEjRuXMABJuLZLDpFAr0eFivwbZmkHMLEA9UlbAsMXjMvNg' github-pages/app-config.js
          node --check github-pages/app-config.js
          node --check github-pages/github-gas-transport.js
          git diff --exit-code -- github-pages/github-gas-transport.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-pages/index.html github-pages/app-config.js
          git diff --cached --check
          git commit -m 'perf: converge P0-D1 reduced production shell'
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
