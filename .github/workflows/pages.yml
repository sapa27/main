name: Deploy GitHub Pages

# One-time source recovery + canonical r297 migration.
on:
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover r296 canonical source and apply r297
        shell: bash
        env:
          R297_OWNER_GZ_B64: ''
        run: |
          printf '%s' "$R297_OWNER_GZ_B64" | base64 -d | gzip -d > /tmp/r297-owner.js
          git show 6e00dfb790ae9ef41126474fd54ceb03938725a3:github-pages/index.html > /tmp/index-r296.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('/tmp/index-r296.html')
          s=p.read_text(encoding='utf-8')
          js=Path('/tmp/r297-owner.js').read_text(encoding='utf-8')
          pat=r'<script id="github-meeting-compat-r296">.*?</script>'
          s,n=re.subn(pat,'<script id="github-commissioner-proposer-owner-r297">'+js+'</script>',s,count=1,flags=re.S)
          if n != 1: raise SystemExit('r296 owner not found exactly once')
          s=s.replace('CANONICAL GITHUB FRONTEND r296','CANONICAL GITHUB FRONTEND r297')
          s=s.replace('app-config.js?v=r296','app-config.js?v=r297')
          s=s.replace('github-gas-transport.js?v=r296','github-gas-transport.js?v=r297')
          s=s.replace('github-deferred-r296','github-deferred-r297')
          Path('github-pages/index.html').write_text(s,encoding='utf-8')
          PY

      - name: Validate recovered canonical r297
        shell: bash
        run: |
          test "$(find github-pages -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          test "$(grep -o 'id="meeting-add-petitioner-btn"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="github-commissioner-proposer-owner-r297"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="github-meeting-compat-r296"' github-pages/index.html | wc -l | tr -d ' ')" = "0"
          grep -q 'CANONICAL GITHUB FRONTEND r297' github-pages/index.html
          grep -q 'app-config.js?v=r297' github-pages/index.html
          grep -q 'github-deferred-r297' github-pages/index.html
          grep -q 'AppApiMiddlewarePipeline' github-pages/index.html
          grep -q 'apiGetPersonnelComms' github-pages/index.html
          grep -q 'github-r297-commissioner-only' github-pages/index.html
          grep -q 'version:"1.2.0-r297"' github-pages/app-config.js
          grep -q 'githubCommissionerLookupOwner:"apiGetPersonnelComms"' github-pages/app-config.js
          grep -q 'DEFERRED_ASSET_FORCE_FRESH:true' github-pages/app-config.js

      - name: Persist canonical r297 source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-pages/index.html github-pages/app-config.js
          if git diff --cached --quiet; then
            echo 'Canonical r297 source already persisted.'
          else
            git commit -m 'chore: recover and persist GitHub commissioner owner r297 [skip ci]'
            git push origin HEAD:main
          fi

      - name: Verify source artifact parity r297
        shell: bash
        run: |
          git diff --exit-code
          test "$(find github-pages -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          test "$(grep -o 'id="github-commissioner-proposer-owner-r297"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="github-meeting-compat-r296"' github-pages/index.html | wc -l | tr -d ' ')" = "0"
          grep -q 'version:"1.2.0-r297"' github-pages/app-config.js
          grep -q 'github-pages/github-gas-transport.js::canonical' github-pages/github-gas-transport.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
