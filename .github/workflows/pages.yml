name: Deploy GitHub Pages

# One-time migration: r303 restores the last bridge-capable GAS endpoint after r302 failed READY/apiLogin.
on:
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Canonicalize frontend r303 when config is ready
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'version:"1.2.0-r303"' github-pages/app-config.js; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('github-pages/index.html')
          s = p.read_text(encoding='utf-8')
          for a,b in [
              ('CANONICAL GITHUB FRONTEND r302','CANONICAL GITHUB FRONTEND r303'),
              ('app-config.js?v=r302','app-config.js?v=r303'),
              ('github-gas-transport.js?v=r302','github-gas-transport.js?v=r303'),
              ('github-deferred-r302','github-deferred-r303')
          ]:
              s = s.replace(a,b)
          p.write_text(s,encoding='utf-8')
          PY
          fi

      - name: Persist canonical r303 source
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- github-pages/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add github-pages/index.html
            git commit -m "chore: persist GitHub transport recovery r303 [skip ci]"
            git push
          fi

      - name: Verify source artifact parity r303
        shell: bash
        run: |
          set -euo pipefail
          test "$(find github-pages -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          test -f github-pages/index.html
          test -f github-pages/app-config.js
          test -f github-pages/github-gas-transport.js
          if grep -q 'version:"1.2.0-r303"' github-pages/app-config.js; then
            grep -q 'CANONICAL GITHUB FRONTEND r303' github-pages/index.html
            grep -q 'app-config.js?v=r303' github-pages/index.html
            grep -q 'github-gas-transport.js?v=r303' github-pages/index.html
            grep -q 'github-deferred-r303' github-pages/index.html
            grep -q 'AKfycbxu2K3ukqReIC8wCalO7P3NRrySO3JUVDoE3d4P0oEzknHehos1u7sCPeeYkashRzgV' github-pages/app-config.js
            ! grep -q 'AKfycbwFGY4RIsqW6gOxIrn4t1jjlFKESHWmJyB-HEoCtLZjZi0_7c8OmJLO4uXK3S3_ph-b' github-pages/app-config.js
          else
            grep -q 'CANONICAL GITHUB FRONTEND r302' github-pages/index.html
          fi
          test "$(grep -o 'id="meeting-add-petitioner-btn"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="github-commissioner-proposer-owner-r297"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="github-ai-duplicate-model-fallback-r299"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          grep -q 'github-pages/github-gas-transport.js::canonical' github-pages/github-gas-transport.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
