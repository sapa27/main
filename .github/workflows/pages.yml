name: Deploy GitHub Pages

# Canonical source = deploy artifact. No deploy-time source mutation.
on:
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical frontend r286
        shell: bash
        run: |
          git diff --exit-code
          grep -q 'app-config.js?v=r286' github-pages/index.html
          grep -q 'github-gas-transport.js?v=r286' github-pages/index.html
          grep -q 'github-deferred-r286' github-pages/index.html
          grep -q 'github-deferred-r286' github-pages/critical-login-runtime.js
          grep -q 'htmlCache\[cacheKey\]' github-pages/index.html
          grep -q 'htmlCache\[cacheKey\]' github-pages/critical-login-runtime.js
          grep -q 'assetVersion:v' github-pages/index.html
          grep -q 'assetVersion:v' github-pages/critical-login-runtime.js
          grep -q 'deferredAssetVersion:v' github-pages/index.html
          grep -q 'deferredAssetVersion:v' github-pages/critical-login-runtime.js
          grep -q 'version:"1.2.0-r286"' github-pages/app-config.js
          grep -q 'pendingReasonCompatibilityGuard:false' github-pages/app-config.js
          grep -q 'pendingReasonOwner:"canonical deferred ReportTrack renderer"' github-pages/app-config.js
          ! grep -q 'installPendingReasonGuard' github-pages/app-config.js
          ! grep -q '__GITHUB_PENDING_REASON_GUARD_R280__' github-pages/app-config.js
          ! grep -q 'github-pending-reason-guard-r280' github-pages/app-config.js
          ! grep -q 'data-github-pending-reason-guard' github-pages/app-config.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
