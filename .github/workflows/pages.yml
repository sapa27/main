name: Deploy GitHub Pages

# Canonical frontend shell remains unchanged. Primary transport is bridge-less:
# POST request body -> GAS -> short-lived Script Cache -> capability JSONP result.
on:
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical frontend bridge-less RPC transport
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(find github-pages -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          test -f github-pages/index.html
          test -f github-pages/app-config.js
          test -f github-pages/github-gas-transport.js

          # Preserve the validated shell/UI exactly.
          grep -q 'CANONICAL GITHUB FRONTEND r306' github-pages/index.html
          grep -q 'app-config.js?v=r306' github-pages/index.html
          grep -q 'github-gas-transport.js?v=r306' github-pages/index.html
          grep -q 'github-deferred-r306' github-pages/index.html
          test "$(grep -o 'id="meeting-add-petitioner-btn"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="github-commissioner-proposer-owner-r297"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="github-ai-duplicate-model-fallback-r299"' github-pages/index.html | wc -l | tr -d ' ')" = "1"

          # Single GAS endpoint + single RPC contract.
          grep -q 'version:"1.2.0-rpc-current-1"' github-pages/app-config.js
          grep -q 'RPC_VERSION="github-pages-rpc-v1"' github-pages/app-config.js
          grep -q 'TRANSPORT_MODE="github-pages-gas-router-rpc"' github-pages/app-config.js
          grep -q 'githubPdfTransferMode:"chunked-start-chunk-final"' github-pages/app-config.js
          grep -q 'AKfycbxu2K3ukqReIC8wCalO7P3NRrySO3JUVDoE3d4P0oEzknHehos1u7sCPeeYkashRzgV' github-pages/app-config.js
          grep -q 'clientInFlightOwner:"github-pages/github-gas-transport.js::canonical-rpc"' github-pages/app-config.js
          grep -q 'bridgeRequired:false' github-pages/app-config.js

          # Warden-independent transport: no cross-window bridge protocol.
          grep -q 'github-pages/github-gas-transport.js::canonical-rpc' github-pages/github-gas-transport.js
          grep -q 'mode: "github-rpc"' github-pages/github-gas-transport.js
          grep -q 'github-rpc-health' github-pages/github-gas-transport.js
          grep -q 'github-rpc-result' github-pages/github-gas-transport.js
          grep -q 'capability-JSONP' github-pages/github-gas-transport.js
          grep -q 'bridgeRequired: false' github-pages/github-gas-transport.js
          if grep -q 'MessageChannel' github-pages/github-gas-transport.js; then
            echo 'FORBIDDEN: MessageChannel primary transport returned' >&2; exit 1
          fi
          if grep -q 'GAS_BRIDGE_PORT_ACK' github-pages/github-gas-transport.js; then
            echo 'FORBIDDEN: bridge port handshake returned' >&2; exit 1
          fi
          if grep -q 'GAS_POST_RESULT_REQUEST' github-pages/github-gas-transport.js; then
            echo 'FORBIDDEN: iframe POST result handshake returned' >&2; exit 1
          fi
          if grep -q 'addEventListener("message"' github-pages/github-gas-transport.js; then
            echo 'FORBIDDEN: window message RPC listener returned' >&2; exit 1
          fi

          node --check github-pages/app-config.js
          node --check github-pages/github-gas-transport.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
