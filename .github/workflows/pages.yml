name: Deploy GitHub Pages

# One-time canonical source migration: GitHub r291 syncs deferred assets with GAS r290.
on:
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Canonicalize frontend r291
        shell: bash
        run: |
          sed -i 's/CANONICAL GITHUB FRONTEND r287/CANONICAL GITHUB FRONTEND r291/g' github-pages/index.html
          sed -i 's/app-config.js?v=r287/app-config.js?v=r291/g' github-pages/index.html
          sed -i 's/github-gas-transport.js?v=r287/github-gas-transport.js?v=r291/g' github-pages/index.html
          sed -i 's/github-deferred-r287/github-deferred-r291/g' github-pages/index.html

          grep -q 'CANONICAL GITHUB FRONTEND r291' github-pages/index.html
          grep -q 'app-config.js?v=r291' github-pages/index.html
          grep -q 'github-gas-transport.js?v=r291' github-pages/index.html
          grep -q 'github-deferred-r291' github-pages/index.html
          grep -q 'version:"1.2.0-r291"' github-pages/app-config.js
          grep -q 'backendFeatureBaseline:"gas-r290"' github-pages/app-config.js
          grep -q 'DEFERRED_ASSET_VERSION:ASSET_VERSION' github-pages/app-config.js
          grep -q 'DEFERRED_ASSET_FORCE_FRESH:true' github-pages/app-config.js

      - name: Persist canonical r291 source
        shell: bash
        run: |
          if git diff --quiet -- github-pages/index.html; then
            echo 'Canonical r291 index already persisted.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add github-pages/index.html
            git commit -m 'chore: sync GitHub deferred asset source r291 [skip ci]'
            git push origin HEAD:main
          fi

      - name: Verify source artifact parity r291
        shell: bash
        run: |
          git diff --exit-code
          test "$(find github-pages -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          test -f github-pages/index.html
          test -f github-pages/app-config.js
          test -f github-pages/github-gas-transport.js
          grep -q 'CANONICAL GITHUB FRONTEND r291' github-pages/index.html
          grep -q 'app-config.js?v=r291' github-pages/index.html
          grep -q 'github-gas-transport.js?v=r291' github-pages/index.html
          grep -q 'github-deferred-r291' github-pages/index.html
          grep -q 'htmlCache\[cacheKey\]' github-pages/index.html
          grep -q 'assetVersion:v' github-pages/index.html
          grep -q 'deferredAssetVersion:v' github-pages/index.html
          grep -q 'version:"1.2.0-r291"' github-pages/app-config.js
          grep -q 'backendFeatureBaseline:"gas-r290"' github-pages/app-config.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
