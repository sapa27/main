name: Deploy GitHub Pages

# One-time canonical migration: GitHub r293 syncs petitioner popup runtime with GAS r293.
on:
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Canonicalize frontend r293
        shell: bash
        run: |
          sed -i 's/CANONICAL GITHUB FRONTEND r292/CANONICAL GITHUB FRONTEND r293/g' github-pages/index.html
          sed -i 's/app-config.js?v=r292/app-config.js?v=r293/g' github-pages/index.html
          sed -i 's/github-gas-transport.js?v=r292/github-gas-transport.js?v=r293/g' github-pages/index.html
          sed -i 's/github-deferred-r292/github-deferred-r293/g' github-pages/index.html

          grep -q 'CANONICAL GITHUB FRONTEND r293' github-pages/index.html
          grep -q 'app-config.js?v=r293' github-pages/index.html
          grep -q 'github-gas-transport.js?v=r293' github-pages/index.html
          grep -q 'github-deferred-r293' github-pages/index.html
          test "$(grep -o 'id="meeting-add-petitioner-btn"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          grep -q 'version:"1.2.0-r293"' github-pages/app-config.js
          grep -q 'backendFeatureBaseline:"gas-r293"' github-pages/app-config.js

      - name: Persist canonical r293 source
        shell: bash
        run: |
          if git diff --quiet -- github-pages/index.html; then
            echo 'Canonical r293 index already persisted.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add github-pages/index.html
            git commit -m 'chore: sync GitHub popup asset source r293 [skip ci]'
            git push origin HEAD:main
          fi

      - name: Verify source artifact parity r293
        shell: bash
        run: |
          git diff --exit-code
          test "$(find github-pages -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          grep -q 'CANONICAL GITHUB FRONTEND r293' github-pages/index.html
          grep -q 'app-config.js?v=r293' github-pages/index.html
          grep -q 'github-gas-transport.js?v=r293' github-pages/index.html
          grep -q 'github-deferred-r293' github-pages/index.html
          test "$(grep -o 'id="meeting-add-petitioner-btn"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          grep -q 'data-meeting-petitioner-actions="canonical"' github-pages/index.html
          grep -q 'version:"1.2.0-r293"' github-pages/app-config.js
          grep -q 'backendFeatureBaseline:"gas-r293"' github-pages/app-config.js
          grep -q 'DEFERRED_ASSET_FORCE_FRESH:true' github-pages/app-config.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
