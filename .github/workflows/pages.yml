name: Deploy GitHub Pages

# One-time canonical source migration: r292 makes the petitioner create button part of the static template.
on:
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Canonicalize frontend r292
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('github-pages/index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('CANONICAL GITHUB FRONTEND r291', 'CANONICAL GITHUB FRONTEND r292')
          text = text.replace('app-config.js?v=r291', 'app-config.js?v=r292')
          text = text.replace('github-gas-transport.js?v=r291', 'github-gas-transport.js?v=r292')
          text = text.replace('github-deferred-r291', 'github-deferred-r292')
          old = '''<div class="d-flex justify-content-between align-items-end mb-1">
          <label class="small fw-bold text-danger mb-0"data-app-term="meetingPetitionerLabel">ผู้เสนอญัตติ/ผู้ร้อง*</label>
          <button class="btn btn-sm btn-outline-info py-0 app-btn-picker"id="meeting-select-petitioner-btn"type="button">เลือกจากฐานข้อมูล</button>
          </div>'''
          new = '''<div class="d-flex justify-content-between align-items-end mb-1">
          <label class="small fw-bold text-danger mb-0"data-app-term="meetingPetitionerLabel">ผู้เสนอญัตติ/ผู้ร้อง*</label>
          <div class="d-flex align-items-center justify-content-end gap-1 flex-wrap"data-meeting-petitioner-actions="canonical">
          <button aria-label="เพิ่มข้อมูลผู้ร้องเรียน"class="btn btn-sm btn-outline-success py-0 app-btn-picker"id="meeting-add-petitioner-btn"type="button"><i aria-hidden="true"class="fas fa-plus me-1"></i>เพิ่มข้อมูล</button>
          <button class="btn btn-sm btn-outline-info py-0 app-btn-picker"id="meeting-select-petitioner-btn"type="button">เลือกจากฐานข้อมูล</button>
          </div>
          </div>'''
          if 'id="meeting-add-petitioner-btn"' not in text:
              if old not in text:
                  raise SystemExit('canonical petitioner action block not found')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

          grep -q 'CANONICAL GITHUB FRONTEND r292' github-pages/index.html
          grep -q 'app-config.js?v=r292' github-pages/index.html
          grep -q 'github-gas-transport.js?v=r292' github-pages/index.html
          grep -q 'github-deferred-r292' github-pages/index.html
          test "$(grep -o 'id="meeting-add-petitioner-btn"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          grep -q 'data-meeting-petitioner-actions="canonical"' github-pages/index.html
          grep -q 'version:"1.2.0-r292"' github-pages/app-config.js
          grep -q 'DEFERRED_ASSET_FORCE_FRESH:true' github-pages/app-config.js

      - name: Persist canonical r292 source
        shell: bash
        run: |
          if git diff --quiet -- github-pages/index.html; then
            echo 'Canonical r292 index already persisted.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add github-pages/index.html
            git commit -m 'chore: persist static petitioner button r292 [skip ci]'
            git push origin HEAD:main
          fi

      - name: Verify source artifact parity r292
        shell: bash
        run: |
          git diff --exit-code
          test "$(find github-pages -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          test -f github-pages/index.html
          test -f github-pages/app-config.js
          test -f github-pages/github-gas-transport.js
          grep -q 'CANONICAL GITHUB FRONTEND r292' github-pages/index.html
          grep -q 'app-config.js?v=r292' github-pages/index.html
          grep -q 'github-gas-transport.js?v=r292' github-pages/index.html
          grep -q 'github-deferred-r292' github-pages/index.html
          grep -q 'htmlCache\[cacheKey\]' github-pages/index.html
          grep -q 'assetVersion:v' github-pages/index.html
          grep -q 'deferredAssetVersion:v' github-pages/index.html
          test "$(grep -o 'id="meeting-add-petitioner-btn"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          grep -q 'data-meeting-petitioner-actions="canonical"' github-pages/index.html
          grep -q 'version:"1.2.0-r292"' github-pages/app-config.js
          grep -q 'clientInFlightOwner:"github-pages/github-gas-transport.js::canonical"' github-pages/app-config.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
