name: Deploy GitHub Pages

# Transport-current convergence: RPC primary, legacy bridge/post migration fallback.
# The r306 shell/UI stays bitwise stable; current transport source is validated separately.
on:
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate transport-current convergence
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(find github-pages -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          test -f github-pages/index.html
          test -f github-pages/app-config.js
          test -f github-pages/github-gas-transport.js

          # Preserve validated r306 UI/DOM shell exactly.
          grep -q 'CANONICAL GITHUB FRONTEND r306' github-pages/index.html
          grep -q 'app-config.js?v=r306' github-pages/index.html
          grep -q 'github-gas-transport.js?v=r306' github-pages/index.html
          grep -q 'github-deferred-r306' github-pages/index.html
          test "$(grep -o 'id="meeting-add-petitioner-btn"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="github-commissioner-proposer-owner-r297"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="github-ai-duplicate-model-fallback-r299"' github-pages/index.html | wc -l | tr -d ' ')" = "1"

          # Current config: one GAS endpoint, RPC primary, legacy deployment fallback.
          grep -q 'version:"1.2.0-transport-current"' github-pages/app-config.js
          grep -q 'RPC_VERSION="github-pages-rpc-v1"' github-pages/app-config.js
          grep -q 'TRANSPORT_MODE="github-pages-gas-router-rpc-primary"' github-pages/app-config.js
          grep -q 'RPC_LEGACY_FALLBACK:true' github-pages/app-config.js
          grep -q 'BRIDGE_VERSION:"github-pages-bridge-v2"' github-pages/app-config.js
          grep -q 'AKfycbxu2K3ukqReIC8wCalO7P3NRrySO3JUVDoE3d4P0oEzknHehos1u7sCPeeYkashRzgV' github-pages/app-config.js
          grep -q 'githubPdfTransferMode:"chunked-start-chunk-final"' github-pages/app-config.js

          # Single transport owner with negotiated RPC primary.
          grep -q 'github-pages/github-gas-transport.js::canonical-hybrid' github-pages/github-gas-transport.js
          grep -q 'function remote(fn,a,opt){return rpcHealth(false)' github-pages/github-gas-transport.js
          grep -q 'function legacyRemote' github-pages/github-gas-transport.js
          grep -q 'github-rpc-health' github-pages/github-gas-transport.js
          grep -q 'github-rpc-result' github-pages/github-gas-transport.js
          grep -q 'params.append("mode","github-rpc")' github-pages/github-gas-transport.js
          grep -q 'A.runLoginPost=function(fn,a,opt){return remote(fn,a,opt)}' github-pages/github-gas-transport.js
          grep -q 'RHS==="ready"?"retired-by-rpc"' github-pages/github-gas-transport.js
          if grep -q 'MessageChannel' github-pages/github-gas-transport.js; then
            echo 'FORBIDDEN: MessageChannel transport returned' >&2
            exit 1
          fi
          if grep -q 'setTimeout(function(){A.warmAuthBridge' github-pages/github-gas-transport.js; then
            echo 'FORBIDDEN: eager legacy bridge warm-up returned' >&2
            exit 1
          fi

          node --check github-pages/app-config.js
          node --check github-pages/github-gas-transport.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
