name: Deploy GitHub Pages

# Runtime publish trigger: login/bootstrap restore 2026-08-10
on:
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp frontend release r285
        shell: bash
        run: |
          sed -E -i 's#app-config\.js\?v=r[0-9]+#app-config.js?v=r285#g' github-pages/index.html
          sed -E -i 's#github-gas-transport\.js\?v=r[0-9]+#github-gas-transport.js?v=r285#g' github-pages/index.html
          grep -q 'app-config.js?v=r285' github-pages/index.html
          grep -q 'github-gas-transport.js?v=r285' github-pages/index.html

      - name: Enforce version-aware deferred assets r285
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          targets = [
              Path('github-pages/index.html'),
              Path('github-pages/critical-login-runtime.js'),
          ]

          new_fetch = '''function deferredAssetVersion(){var c=root2.APP_CONFIG||{},g=root2.APP_GITHUB_CONFIG||{},d=root2.APP_DEPLOY_RELEASE||{},v=txt(c.deferredAssetVersion||g.DEFERRED_ASSET_VERSION||d.deferredAssetVersion||"").trim();return v||"unversioned"}function deferredAssetForceFresh(){var c=root2.APP_CONFIG||{},g=root2.APP_GITHUB_CONFIG||{};return c.deferredAssetForceFresh===!0||g.DEFERRED_ASSET_FORCE_FRESH===!0}function fetchPartialHtml(n){if(!(n=txt(n).trim()))return Promise.reject(new Error("ไม่ได้ระบุชื่อ partial"));var v=deferredAssetVersion(),cacheKey=v+"::"+n;if(Object.prototype.hasOwnProperty.call(htmlCache,cacheKey))return Promise.resolve(htmlCache[cacheKey]);var fetchKey=cacheKey+"::fetch",forceFresh=deferredAssetForceFresh();return inflight[fetchKey]||(inflight[fetchKey]=root2.AppApi.call("getDeferredInclude",{name:n,assetVersion:v,deferredAssetVersion:v,forceFresh:forceFresh,noCache:forceFresh,bypassCache:forceFresh,cacheTtlSeconds:forceFresh?0:void 0,source:"github-deferred-r285"}).then(function(r){var h=txt(r&&r.html||r&&r.data&&r.data.html||r||"");return htmlCache[cacheKey]=h,delete inflight[fetchKey],h},function(err){throw delete inflight[fetchKey],err}))}function prefetchPartial(n)'''
          new_load = '''function loadPartial(n,o){if(o=o||{},!(n=txt(n).trim()))return Promise.reject(new Error("ไม่ได้ระบุชื่อ partial"));var t=o.mountTarget?id(o.mountTarget):null,v=deferredAssetVersion(),k=v+"::"+n+(t?"::mount":"");return!t&&loaded[k]?Promise.resolve(!0):fetchPartialHtml(n).then(function(h){return execHtml(h,t||null),loaded[k]=!0,!0})}function safePartial(n,o)'''

          for path in targets:
              if not path.exists():
                  raise SystemExit('missing deferred asset owner: ' + str(path))
              text = path.read_text(encoding='utf-8')
              text, fetch_count = re.subn(
                  r'function fetchPartialHtml\(n\)\{.*?\}function prefetchPartial\(n\)',
                  lambda _m: new_fetch,
                  text,
                  count=1,
                  flags=re.S,
              )
              text, load_count = re.subn(
                  r'function loadPartial\(n,o\)\{.*?\}function safePartial\(n,o\)',
                  lambda _m: new_load,
                  text,
                  count=1,
                  flags=re.S,
              )
              if fetch_count != 1 or load_count != 1:
                  raise SystemExit(
                      'deferred asset patch mismatch for %s: fetch=%s load=%s'
                      % (path, fetch_count, load_count)
                  )
              if 'htmlCache[cacheKey]' not in text or 'github-deferred-r285' not in text:
                  raise SystemExit('deferred asset validation failed for ' + str(path))
              path.write_text(text, encoding='utf-8')
              print('patched', path)
          PY
          grep -q 'github-deferred-r285' github-pages/index.html
          grep -q 'github-deferred-r285' github-pages/critical-login-runtime.js
          grep -q 'htmlCache\[cacheKey\]' github-pages/index.html
          grep -q 'htmlCache\[cacheKey\]' github-pages/critical-login-runtime.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
