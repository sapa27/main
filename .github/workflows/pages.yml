name: Deploy GitHub Pages

# Canonical source = deploy artifact. P2 technical-debt baseline r287.
on:
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical frontend r287
        shell: bash
        run: |
          git diff --exit-code
          test "$(find github-pages -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          test -f github-pages/index.html
          test -f github-pages/app-config.js
          test -f github-pages/github-gas-transport.js

          grep -q 'CANONICAL GITHUB FRONTEND r287' github-pages/index.html
          grep -q 'app-config.js?v=r287' github-pages/index.html
          grep -q 'github-gas-transport.js?v=r287' github-pages/index.html
          grep -q 'github-deferred-r287' github-pages/index.html
          grep -q 'htmlCache\[cacheKey\]' github-pages/index.html
          grep -q 'assetVersion:v' github-pages/index.html
          grep -q 'deferredAssetVersion:v' github-pages/index.html

          grep -q 'version:"1.2.0-r287"' github-pages/app-config.js
          grep -q 'pendingReasonCompatibilityGuard:false' github-pages/app-config.js
          grep -q 'clientInFlightOwner:"github-pages/github-gas-transport.js::canonical"' github-pages/app-config.js
          grep -q 'github-pages/github-gas-transport.js::canonical' github-pages/github-gas-transport.js

          ! grep -q 'r260-apps-script-origin-trust' github-pages/app-config.js
          ! grep -q 'r260-apps-script-origin-trust' github-pages/github-gas-transport.js
          ! grep -q 'installPendingReasonGuard' github-pages/app-config.js

          for f in \
            app-index-bootstrap.js \
            app-index-foundation-after-swal.js \
            app-index-foundation-after-vue.js \
            app-index-foundation-pre-vue.js \
            critical-login-runtime.js \
            vercel-env.generated.js; do
            test ! -e "github-pages/$f"
            ! grep -R -F "$f" github-pages
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
