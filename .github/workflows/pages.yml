name: Deploy GitHub Pages

# One-time canonical source migration: r296 closes GitHub meeting compatibility gaps on the bridge-recovery endpoint.
on:
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Canonicalize frontend r296
        shell: bash
        env:
          R296_SHIM_B64: "PHNjcmlwdCBpZD0iZ2l0aHViLW1lZXRpbmctY29tcGF0LXIyOTYiPgooZnVuY3Rpb24ocm9vdCxkb2MpeyJ1c2Ugc3RyaWN0IjsKaWYoIXJvb3R8fCFkb2N8fHJvb3QuX19HSVRI     lbmZvcmNlQ3VycmVudCgpfSxmYWxzZSl9Y2F0Y2goZSl7fQp9KTsKWzAsODAsMjIwLDUwMCwxMDAwLDE4MDAsMzAwMF0uZm9yRWFjaChmdW5jdGlvbihtcyl7c2V0VGltZW91dChmdW5jdGlvbigpe3BhdGNoQXBpT3duZXJzKCk7c3luY0FkZEJ1dHRvbigpfSxtcyl9KTsKfSkod2luZG93LGRvY3VtZW50KTsKPC9zY3JpcHQ+"
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, base64
          p=Path("github-pages/index.html")
          s=p.read_text(encoding="utf-8")
          s=s.replace("CANONICAL GITHUB FRONTEND r295","CANONICAL GITHUB FRONTEND r296")
          s=s.replace("app-config.js?v=r295","app-config.js?v=r296")
          s=s.replace("github-gas-transport.js?v=r295","github-gas-transport.js?v=r296")
          s=s.replace("github-deferred-r295","github-deferred-r296")
          shim=base64.b64decode(os.environ["R296_SHIM_B64"]).decode("utf-8")
          marker='id="github-meeting-compat-r296"'
          if marker not in s:
              if "</body>" not in s:
                  raise SystemExit("missing </body>")
              s=s.replace("</body>",shim+"\n</body>",1)
          p.write_text(s,encoding="utf-8")
          PY

          grep -q 'CANONICAL GITHUB FRONTEND r296' github-pages/index.html
          grep -q 'app-config.js?v=r296' github-pages/index.html
          grep -q 'github-gas-transport.js?v=r296' github-pages/index.html
          grep -q 'github-deferred-r296' github-pages/index.html
          test "$(grep -o 'id="github-meeting-compat-r296"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          grep -q 'github-r296-commissioner-proposer' github-pages/index.html
          grep -q 'github-meeting-compat-r296' github-pages/index.html
          grep -q 'version:"1.2.0-r296"' github-pages/app-config.js

      - name: Persist canonical r296 source
        shell: bash
        run: |
          if git diff --quiet -- github-pages/index.html; then
            echo 'Canonical r296 index already persisted.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add github-pages/index.html
            git commit -m 'chore: sync GitHub meeting compatibility source r296 [skip ci]'
            git push origin HEAD:main
          fi

      - name: Verify source artifact parity r296
        shell: bash
        run: |
          git diff --exit-code
          test "$(find github-pages -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          test -f github-pages/index.html
          test -f github-pages/app-config.js
          test -f github-pages/github-gas-transport.js

          grep -q 'CANONICAL GITHUB FRONTEND r296' github-pages/index.html
          grep -q 'app-config.js?v=r296' github-pages/index.html
          grep -q 'github-gas-transport.js?v=r296' github-pages/index.html
          grep -q 'github-deferred-r296' github-pages/index.html
          grep -q 'htmlCache\[cacheKey\]' github-pages/index.html
          grep -q 'assetVersion:v' github-pages/index.html
          grep -q 'deferredAssetVersion:v' github-pages/index.html

          test "$(grep -o 'id="meeting-add-petitioner-btn"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="github-meeting-compat-r296"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          grep -q 'data-meeting-petitioner-actions="canonical"' github-pages/index.html
          grep -q 'github-r296-commissioner-proposer' github-pages/index.html
          grep -q 'loadPageScripts("petitioner")' github-pages/index.html

          grep -q 'version:"1.2.0-r296"' github-pages/app-config.js
          grep -q 'githubMeetingCompatibilityOwner:"github-pages/index.html::meeting-compat-r296"' github-pages/app-config.js
          grep -q 'AKfycbxu2K3ukqReIC8wCalO7P3NRrySO3JUVDoE3d4P0oEzknHehos1u7sCPeeYkashRzgV' github-pages/app-config.js
          grep -q 'DEFERRED_ASSET_FORCE_FRESH:true' github-pages/app-config.js
          grep -q 'github-pages/github-gas-transport.js::canonical' github-pages/github-gas-transport.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
