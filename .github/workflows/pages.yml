name: Deploy GitHub Pages

# Runtime publish trigger: login/bootstrap restore 2026-08-10
on:
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stamp frontend release r280
        shell: bash
        run: |
          sed -E -i 's#app-config\.js\?v=r[0-9]+#app-config.js?v=r280#g' github-pages/index.html
          sed -E -i 's#github-gas-transport\.js\?v=r[0-9]+#github-gas-transport.js?v=r280#g' github-pages/index.html
          grep -q 'app-config.js?v=r280' github-pages/index.html
          grep -q 'github-gas-transport.js?v=r280' github-pages/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
