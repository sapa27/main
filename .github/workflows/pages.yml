name: Deploy GitHub Pages

# Canonical frontend shell stays at r306; transport contract is r309/mc2.
# Google Apps Script HTML Service must initiate MessageChannel. GitHub must not
# send window.postMessage directly into the googleusercontent sandbox.
on:
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical frontend r309 MessageChannel transport
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(find github-pages -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          test -f github-pages/index.html
          test -f github-pages/app-config.js
          test -f github-pages/github-gas-transport.js

          # Preserve the validated r306 shell/UI exactly.
          grep -q 'CANONICAL GITHUB FRONTEND r306' github-pages/index.html
          grep -q 'app-config.js?v=r306' github-pages/index.html
          grep -q 'github-gas-transport.js?v=r306' github-pages/index.html
          grep -q 'github-deferred-r306' github-pages/index.html
          grep -q 'htmlCache\[cacheKey\]' github-pages/index.html
          grep -q 'assetVersion:v' github-pages/index.html
          grep -q 'deferredAssetVersion:v' github-pages/index.html
          test "$(grep -o 'id="meeting-add-petitioner-btn"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="github-commissioner-proposer-owner-r297"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="github-ai-duplicate-model-fallback-r299"' github-pages/index.html | wc -l | tr -d ' ')" = "1"

          # Single coherent GAS endpoint + mc2 contract.
          grep -q 'version:"1.2.0-r309"' github-pages/app-config.js
          grep -q 'BRIDGE_VERSION="github-pages-bridge-v2-mc2"' github-pages/app-config.js
          grep -q 'backendFeatureBaseline:"gas-messagechannel-mc2-ai-chunk"' github-pages/app-config.js
          grep -q 'githubPdfTransferMode:"chunked-start-chunk-final"' github-pages/app-config.js
          grep -q 'AKfycbxu2K3ukqReIC8wCalO7P3NRrySO3JUVDoE3d4P0oEzknHehos1u7sCPeeYkashRzgV' github-pages/app-config.js
          grep -q 'DEFERRED_ASSET_VERSION:ASSET_VERSION' github-pages/app-config.js
          grep -q 'DEFERRED_ASSET_FORCE_FRESH:true' github-pages/app-config.js
          grep -q 'clientInFlightOwner:"github-pages/github-gas-transport.js::canonical"' github-pages/app-config.js

          # Warden-safe primary transport: transferred MessagePort only.
          grep -q 'github-pages/github-gas-transport.js::canonical' github-pages/github-gas-transport.js
          grep -q 'event.ports' github-pages/github-gas-transport.js
          grep -q 'GAS_BRIDGE_PORT_ACK' github-pages/github-gas-transport.js
          grep -q 'bridgePort.postMessage' github-pages/github-gas-transport.js
          grep -q 'v2-message-port' github-pages/github-gas-transport.js
          if grep -q 'frame\.contentWindow\.postMessage' github-pages/github-gas-transport.js; then
            echo 'FORBIDDEN: direct GitHub -> GAS iframe window.postMessage found' >&2
            exit 1
          fi
          if grep -q 'GAS_POST_RESULT_REQUEST' github-pages/github-gas-transport.js; then
            echo 'FORBIDDEN: POST result request/ack handshake found' >&2
            exit 1
          fi
          if grep -q 'GAS_IFRAME_TRANSPORT_PING_READY' github-pages/github-gas-transport.js; then
            echo 'FORBIDDEN: legacy iframe READY ping found' >&2
            exit 1
          fi

          node --check github-pages/app-config.js
          node --check github-pages/github-gas-transport.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
