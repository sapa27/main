name: Deploy GitHub Pages

# Canonical source = deploy artifact. r297 enforces commissioner-only proposer lookup on the bridge-recovery backend.
on:
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical frontend r297
        shell: bash
        run: |
          git diff --exit-code
          test "$(find github-pages -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          test -f github-pages/index.html
          test -f github-pages/app-config.js
          test -f github-pages/github-gas-transport.js

          grep -q 'CANONICAL GITHUB FRONTEND r297' github-pages/index.html
          grep -q 'app-config.js?v=r297' github-pages/index.html
          grep -q 'github-gas-transport.js?v=r297' github-pages/index.html
          grep -q 'github-deferred-r297' github-pages/index.html
          grep -q 'htmlCache\[cacheKey\]' github-pages/index.html
          grep -q 'assetVersion:v' github-pages/index.html
          grep -q 'deferredAssetVersion:v' github-pages/index.html

          test "$(grep -o 'id="meeting-add-petitioner-btn"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="github-commissioner-proposer-owner-r297"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="github-meeting-compat-r296"' github-pages/index.html | wc -l | tr -d ' ')" = "0"
          grep -q 'data-meeting-petitioner-actions="canonical"' github-pages/index.html
          grep -q 'AppApiMiddlewarePipeline' github-pages/index.html
          grep -q 'apiGetPersonnelComms' github-pages/index.html
          grep -q 'github-r297-commissioner-only' github-pages/index.html
          grep -q 'x.petitioners = \[\]' github-pages/index.html
          grep -q 'input.readOnly = true' github-pages/index.html
          grep -q 'var STORE_KEY = "meeting.lookup." + CATEGORY' github-pages/index.html

          grep -q 'version:"1.2.0-r297"' github-pages/app-config.js
          grep -q 'backendFeatureBaseline:"gas-bridge-recovery"' github-pages/app-config.js
          grep -q 'githubMeetingCompatibilityOwner:"github-pages/index.html::commissioner-proposer-owner-r297"' github-pages/app-config.js
          grep -q 'githubCommissionerLookupOwner:"apiGetPersonnelComms"' github-pages/app-config.js
          grep -q 'githubCommissionerCacheOwner:"meeting.lookup.กรรมาธิการเสนอญัตติ::r297"' github-pages/app-config.js
          grep -q 'AKfycbxu2K3ukqReIC8wCalO7P3NRrySO3JUVDoE3d4P0oEzknHehos1u7sCPeeYkashRzgV' github-pages/app-config.js
          grep -q 'DEFERRED_ASSET_VERSION:ASSET_VERSION' github-pages/app-config.js
          grep -q 'DEFERRED_ASSET_FORCE_FRESH:true' github-pages/app-config.js
          grep -q 'clientInFlightOwner:"github-pages/github-gas-transport.js::canonical"' github-pages/app-config.js
          grep -q 'github-pages/github-gas-transport.js::canonical' github-pages/github-gas-transport.js

          ! grep -q 'CANONICAL GITHUB FRONTEND r296' github-pages/index.html
          ! grep -q 'github-deferred-r296' github-pages/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
