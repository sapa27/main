name: Deploy GitHub Pages

# RPC-required transport: Google Warden blocks GitHub -> GAS iframe postMessage.
# P1-A deferred-template shell: transport remains POST body + capability JSONP only.
on:
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate RPC-required transport
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test "$(find github-pages -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          test -f github-pages/index.html
          test -f github-pages/app-config.js
          test -f github-pages/github-gas-transport.js
          test "$(wc -c < github-pages/index.html | tr -d ' ')" -le 350000

          grep -q 'CANONICAL GITHUB FRONTEND r315' github-pages/index.html
          grep -q 'app-config.js?v=r315' github-pages/index.html
          grep -q 'github-gas-transport.js?v=r315' github-pages/index.html
          grep -q 'deferredTemplates:{"tpl-page-dashboard":"Scripts_Page_Dashboard"' github-pages/index.html
          if grep -q 'id="tpl-page-dashboard"' github-pages/index.html; then
            echo 'FORBIDDEN: dashboard template returned to critical index' >&2; exit 1
          fi
          if grep -q 'id="app-production-measurement-gate-current"' github-pages/index.html; then
            echo 'FORBIDDEN: production measurement gate returned to critical index' >&2; exit 1
          fi
          if grep -q 'github-commissioner-proposer-owner-r297' github-pages/index.html; then
            echo 'FORBIDDEN: meeting compatibility patch returned to critical index' >&2; exit 1
          fi
          if grep -q 'github-ai-duplicate-model-fallback-r299' github-pages/index.html; then
            echo 'FORBIDDEN: AI fallback returned to critical index' >&2; exit 1
          fi

          grep -q 'version:"1.3.2-case-edit-single-pass"' github-pages/app-config.js
          grep -q 'RPC_VERSION="github-pages-rpc-v1"' github-pages/app-config.js
          grep -q 'TRANSPORT_MODE="github-pages-gas-router-rpc-required"' github-pages/app-config.js
          grep -q 'RPC_LEGACY_FALLBACK:false' github-pages/app-config.js
          grep -q 'RPC_HEALTH_TIMEOUT_MS:20000' github-pages/app-config.js
          grep -q 'RPC_RESULT_JSONP_TIMEOUT_MS:20000' github-pages/app-config.js
          grep -q 'RPC_HEALTH_RETRIES:1' github-pages/app-config.js
          grep -q 'AKfycbyJLevL2sE1vr44Ie2t65X1u5v1FLDESNNLpeGsH49jqpedxgHH6hwcLONq7snJJY6t' github-pages/app-config.js
          grep -q 'githubPdfTransferMode:"chunked-start-chunk-final"' github-pages/app-config.js
          grep -q 'ASSET_VERSION="r315-case-edit-20260819"' github-pages/app-config.js
          grep -q 'criticalShellOwner:"github-pages/index.html::p1a-r313"' github-pages/app-config.js
          grep -q 'deferredTemplateOwner:"gas-backend/page-assets::r315"' github-pages/app-config.js
          grep -q 'dashboardPersistentSnapshotOwner:"Code_05_Repository_Cache_Performance.PersistentDashboardSWR::p1b-r314"' github-pages/app-config.js
          grep -q 'dashboardPersistentSnapshotMode:"stale-while-revalidate"' github-pages/app-config.js

          grep -q 'github-pages/github-gas-transport.js::canonical-rpc-resilient' github-pages/github-gas-transport.js
          grep -q 'github-pages-gas-router-rpc-required' github-pages/github-gas-transport.js
          grep -q 'github-rpc-health' github-pages/github-gas-transport.js
          grep -q 'github-rpc-result' github-pages/github-gas-transport.js
          grep -q 'GAS_RPC_HEALTH_TIMEOUT' github-pages/github-gas-transport.js
          grep -q 'GAS_RPC_RESULT_TIMEOUT' github-pages/github-gas-transport.js
          grep -q 'resultRetries' github-pages/github-gas-transport.js
          grep -q 'mode:"github-rpc"' github-pages/github-gas-transport.js
          grep -q 'GOOGLE_WARDEN_DROPS_GITHUB_POSTMESSAGE' github-pages/github-gas-transport.js

          if grep -q 'GAS_POST_RESULT_REQUEST' github-pages/github-gas-transport.js; then
            echo 'FORBIDDEN: legacy POST postMessage handshake returned' >&2; exit 1
          fi
          if grep -q 'GAS_BRIDGE_READY_PROBE' github-pages/github-gas-transport.js; then
            echo 'FORBIDDEN: legacy bridge probe returned' >&2; exit 1
          fi
          if grep -q 'MessageChannel' github-pages/github-gas-transport.js; then
            echo 'FORBIDDEN: MessageChannel returned' >&2; exit 1
          fi
          if grep -q 'addEventListener("message"' github-pages/github-gas-transport.js; then
            echo 'FORBIDDEN: cross-window message transport returned' >&2; exit 1
          fi

          node --check github-pages/app-config.js
          node --check github-pages/github-gas-transport.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
