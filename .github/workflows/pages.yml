name: Deploy GitHub Pages

# One-time canonical source migration: r299 adds GitHub duplicate-check compatibility fallback.
on:
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Canonicalize frontend r299
        shell: bash
        env:
          R299_GUARD_B64: ""
        run: |
          python - <<'PY2'
          from pathlib import Path
          import os, base64
          p=Path('github-pages/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('CANONICAL GITHUB FRONTEND r297','CANONICAL GITHUB FRONTEND r299')
          s=s.replace('app-config.js?v=r297','app-config.js?v=r299')
          s=s.replace('github-gas-transport.js?v=r297','github-gas-transport.js?v=r299')
          s=s.replace('github-deferred-r297','github-deferred-r299')
          guard_id='github-ai-duplicate-model-fallback-r299'
          if guard_id not in s:
              guard=base64.b64decode(os.environ['R299_GUARD_B64']).decode('utf-8')
              marker='</body>'
              if marker not in s: raise SystemExit('missing </body>')
              s=s.replace(marker, '\n<script id="'+guard_id+'">'+guard+'</script>\n'+marker, 1)
          p.write_text(s,encoding='utf-8')
          PY2

          grep -q 'CANONICAL GITHUB FRONTEND r299' github-pages/index.html
          grep -q 'app-config.js?v=r299' github-pages/index.html
          grep -q 'github-gas-transport.js?v=r299' github-pages/index.html
          grep -q 'github-deferred-r299' github-pages/index.html
          test "$(grep -o 'id="github-ai-duplicate-model-fallback-r299"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="github-commissioner-proposer-owner-r297"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="meeting-add-petitioner-btn"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          grep -q 'apiCheckDuplicateCase' github-pages/index.html
          grep -q 'apiGetCaseReportExportRows' github-pages/index.html
          grep -q 'gemini-3.6-flash' github-pages/index.html
          grep -q 'version:"1.2.0-r299"' github-pages/app-config.js
          grep -q 'githubAiDuplicateFallbackOwner:"github-pages/index.html::ai-duplicate-model-fallback-r299"' github-pages/app-config.js
          grep -q 'DEFERRED_ASSET_FORCE_FRESH:true' github-pages/app-config.js

      - name: Persist canonical r299 source
        shell: bash
        run: |
          if git diff --quiet -- github-pages/index.html; then
            echo 'Canonical r299 index already persisted.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add github-pages/index.html
            git commit -m 'chore: sync GitHub AI duplicate fallback r299 [skip ci]'
            git push origin HEAD:main
          fi

      - name: Verify source artifact parity r299
        shell: bash
        run: |
          git diff --exit-code
          test "$(find github-pages -maxdepth 1 -type f | wc -l | tr -d ' ')" = "3"
          test -f github-pages/index.html
          test -f github-pages/app-config.js
          test -f github-pages/github-gas-transport.js
          grep -q 'CANONICAL GITHUB FRONTEND r299' github-pages/index.html
          grep -q 'app-config.js?v=r299' github-pages/index.html
          grep -q 'github-gas-transport.js?v=r299' github-pages/index.html
          grep -q 'github-deferred-r299' github-pages/index.html
          test "$(grep -o 'id="github-ai-duplicate-model-fallback-r299"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="github-commissioner-proposer-owner-r297"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'id="meeting-add-petitioner-btn"' github-pages/index.html | wc -l | tr -d ' ')" = "1"
          grep -q 'version:"1.2.0-r299"' github-pages/app-config.js
          grep -q 'AKfycbxu2K3ukqReIC8wCalO7P3NRrySO3JUVDoE3d4P0oEzknHehos1u7sCPeeYkashRzgV' github-pages/app-config.js
          grep -q 'github-pages/github-gas-transport.js::canonical' github-pages/github-gas-transport.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
