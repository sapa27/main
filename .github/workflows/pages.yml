name: Deploy GitHub Pages

# One-time source migration for r286. Final workflow returns to validation-only.
on:
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Canonicalize frontend r286
        shell: bash
        run: |
          sed -E -i 's#app-config\.js\?v=r[0-9]+#app-config.js?v=r286#g' github-pages/index.html
          sed -E -i 's#github-gas-transport\.js\?v=r[0-9]+#github-gas-transport.js?v=r286#g' github-pages/index.html
          sed -i 's/github-deferred-r285/github-deferred-r286/g' github-pages/index.html github-pages/critical-login-runtime.js
          sed -E -i 's#<!-- GENERATED FROM GAS CANONICAL INDEX r270 — GitHub host shell must not be edited independently\. -->#<!-- CANONICAL GITHUB FRONTEND r286 — lineage from GAS canonical shell; source equals deploy artifact. -->#' github-pages/index.html
          grep -q 'app-config.js?v=r286' github-pages/index.html
          grep -q 'github-gas-transport.js?v=r286' github-pages/index.html
          grep -q 'github-deferred-r286' github-pages/index.html
          grep -q 'github-deferred-r286' github-pages/critical-login-runtime.js

      - name: Persist r286 canonical source
        shell: bash
        run: |
          if git diff --quiet -- github-pages/index.html github-pages/critical-login-runtime.js; then
            echo 'Canonical r286 source already persisted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add github-pages/index.html github-pages/critical-login-runtime.js
          git commit -m 'chore: canonicalize GitHub frontend r286 [skip ci]'
          git push origin HEAD:main

      - name: Verify r286 source/artifact parity
        shell: bash
        run: |
          test -z "$(git diff -- github-pages/index.html github-pages/critical-login-runtime.js)"
          grep -q 'app-config.js?v=r286' github-pages/index.html
          grep -q 'github-gas-transport.js?v=r286' github-pages/index.html
          grep -q 'github-deferred-r286' github-pages/index.html
          grep -q 'github-deferred-r286' github-pages/critical-login-runtime.js
          grep -q 'htmlCache\[cacheKey\]' github-pages/index.html
          grep -q 'htmlCache\[cacheKey\]' github-pages/critical-login-runtime.js
          grep -q 'assetVersion:v' github-pages/index.html
          grep -q 'deferredAssetVersion:v' github-pages/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
