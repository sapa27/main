name: Validate and Deploy GitHub Pages

on:
  pull_request:
    branches: [main]
    paths:
      - 'github-pages/**'
      - 'gas-backend/**'
      - '.github/tests/regression.mjs'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'github-pages/**'
      - 'gas-backend/**'
      - '.github/tests/regression.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run R330 automated regression suite
        shell: bash
        run: |
          set -euo pipefail
          if [ -d gas-backend ]; then
            node .github/tests/regression.mjs --full
          else
            node .github/tests/regression.mjs --frontend-only
          fi

  deploy:
    needs: regression
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
