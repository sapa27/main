name: P1 Direct-GAS Final Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p1-directgas-final-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply runtime cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          def one(path,old,new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit('missing marker in '+path)
              p.write_text(s.replace(old,new,1))
          one('github-pages/app-config.js','HA="github-pages-canonical-projection-r331-v62"','HA="github-pages-canonical-projection-r331-v62-directgas-p1-20260916"')
          one('github-pages/index.html','./app-config.js?v=r331-v62-reliability','./app-config.js?v=r331-v62-directgas-p1-20260916')
          one('github-pages/index.html','./github-gas-transport.js?v=r331-v62-reliability','./github-gas-transport.js?v=r331-v62-directgas-p1-20260916')
          one('github-pages/github-gas-transport.js','w.setTimeout(function(){try{delete w[cb]}catch(_){w[cb]=void 0}},600000)','w.setTimeout(function(){try{delete w[cb]}catch(_){w[cb]=void 0}},Math.min(90000,Math.max(60000,timeoutMs*2)))')
          p=Path('.github/tests/regression.mjs'); s=p.read_text()
          s=s.replace('./app-config.js?v=r331-v62-reliability','./app-config.js?v=r331-v62-directgas-p1-20260916')
          s=s.replace('./github-gas-transport.js?v=r331-v62-reliability','./github-gas-transport.js?v=r331-v62-directgas-p1-20260916')
          old="assert.equal(p.hostArtifact,'github-pages-canonical-projection-r331-v62');"
          new="assert.equal(p.hostArtifact,'github-pages-canonical-projection-r331-v62-directgas-p1-20260916');"
          if old not in s: raise SystemExit('host artifact regression marker missing')
          s=s.replace(old,new,1)
          old="assert.ok(transport.includes('},600000)'));"
          new="assert.ok(!transport.includes('},600000)'));\n  assert.ok(transport.includes('Math.min(90000,Math.max(60000,timeoutMs*2))'));"
          if old not in s: raise SystemExit('tombstone regression marker missing')
          p.write_text(s.replace(old,new,1))
          PY
          node .github/tests/regression.mjs --frontend-only
          test "$(wc -c < github-pages/app-config.js)" -le 3000
          test "$(wc -c < github-pages/github-gas-transport.js)" -le 12000
          test "$(wc -c < github-pages/index.html)" -le 545000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-pages/app-config.js github-pages/index.html github-pages/github-gas-transport.js .github/tests/regression.mjs
          git commit -m "P1 Direct-GAS runtime cleanup"
          git push
      - name: Upload runtime snapshot
        uses: actions/upload-artifact@v4
        with:
          name: p1-directgas-runtime-snapshot
          path: |
            github-pages
            .github/tests/regression.mjs
