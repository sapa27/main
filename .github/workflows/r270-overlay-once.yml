name: Apply r270 Overlay Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r270-overlay-once.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  apply-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble canonical r270 overlay
        shell: bash
        env:
          APP_CONFIG_B64: 
        run: |
          set -euo pipefail
          cat .r270-overlay/part* | base64 -d | xz -d > github-pages/index.html
          printf '%s' "$APP_CONFIG_B64" | base64 -d > github-pages/app-config.js
          test "$(sha256sum github-pages/index.html | awk '{print $1}')" = "c2af63cc7896ebd226c51b5322955bee4b4940a1e1780ba2704808ff12361de7"
          test "$(sha256sum github-pages/app-config.js | awk '{print $1}')" = "344aea7792a890aad4502d7fa4686aee07af50823b3fa5a827bdeab598309350"
          grep -q './github-gas-transport.js?v=r270' github-pages/index.html
          ! grep -Eq 'vercel-env.generated.js|app-index-foundation-pre-vue.js|app-index-foundation-after-vue.js|app-index-foundation-after-swal.js|critical-login-runtime.js|app-index-bootstrap.js' github-pages/index.html
          rm -rf .r270-overlay
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: apply canonical r270 GitHub UI parity overlay"
          git push origin HEAD:main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
