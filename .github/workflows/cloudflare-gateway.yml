name: Deploy Cloudflare P0-E Gateway

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-p0e-gateway-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static gateway validation
        shell: bash
        run: |
          set -euo pipefail
          node --check gateway/cloudflare/src/index.js
          test -f gateway/cloudflare/wrangler.toml
          if grep -R "script.google.com/macros/s/" gateway/cloudflare/src gateway/cloudflare/wrangler.toml; then
            echo "GAS production URL must not be hard-coded in Cloudflare source" >&2
            exit 1
          fi
          grep -q "provider: 'cloudflare'" gateway/cloudflare/src/index.js
          grep -q "github-pages-rpc-r330" gateway/cloudflare/wrangler.toml

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: cloudflare-gateway-production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Cloudflare Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: gateway/cloudflare
          wranglerVersion: "4"
          secrets: |
            GAS_WEB_APP_URL
        env:
          GAS_WEB_APP_URL: ${{ secrets.GAS_WEB_APP_URL }}

      - name: Validate Cloudflare gateway health and RPC round trip
        shell: bash
        env:
          GATEWAY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          node <<'NODE'
          import { randomUUID } from 'node:crypto';
          const gateway = String(process.env.GATEWAY_URL || '').trim().replace(/\/$/, '');
          const origin = 'https://sapa27.github.io';
          const rpcVersion = 'github-pages-rpc-r330';
          if (!/^https:\/\//.test(gateway)) throw new Error('Cloudflare deployment URL missing');

          async function get(mode, params = {}, timeout = 30000) {
            const url = new URL(gateway);
            url.searchParams.set('mode', mode);
            url.searchParams.set('parentOrigin', origin);
            url.searchParams.set('rpcVersion', rpcVersion);
            for (const [k,v] of Object.entries(params)) url.searchParams.set(k, String(v));
            const response = await fetch(url, {
              headers: { Origin: origin },
              cache: 'no-store',
              redirect: 'follow',
              signal: AbortSignal.timeout(timeout)
            });
            const text = await response.text();
            let payload;
            try { payload = text ? JSON.parse(text) : {}; } catch { throw new Error('Gateway returned non-JSON: '+text.slice(0,160)); }
            if (!response.ok) throw new Error('Gateway '+mode+' HTTP '+response.status+': '+JSON.stringify(payload));
            return payload;
          }

          const health = await get('health');
          if (health.gatewayOk !== true) throw new Error('gatewayOk != true');
          if (health.provider !== 'cloudflare') throw new Error('provider mismatch');
          if (health.allowedOrigin !== true) throw new Error('origin denied by GAS');
          if (health.transportVersion !== rpcVersion) throw new Error('RPC version mismatch');

          const rpcId = 'req_cf_' + randomUUID().replaceAll('-','');
          const rpcToken = 'tok_cf_' + randomUUID().replaceAll('-','');
          const traceId = 'trace_cf_' + randomUUID().replaceAll('-','');
          const post = await fetch(gateway, {
            method: 'POST',
            headers: { Origin: origin, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              parentOrigin: origin,
              rpcVersion,
              rpcId,
              rpcToken,
              rpcFunction: 'apiRouter',
              rpcPayload: { method: 'apiSessionCheck', payload: {} },
              traceId,
              clientStartedAt: new Date().toISOString()
            }),
            cache: 'no-store',
            redirect: 'follow',
            signal: AbortSignal.timeout(45000)
          });
          const accepted = await post.json();
          if (post.status !== 202 || accepted.accepted !== true || accepted.provider !== 'cloudflare') {
            throw new Error('Gateway POST rejected: '+post.status+' '+JSON.stringify(accepted));
          }

          const deadline = Date.now() + 90000;
          let result = null;
          let attempt = 0;
          while (Date.now() < deadline) {
            attempt += 1;
            result = await get('result', { rpcId, rpcToken }, 30000);
            if (result.pending !== true) break;
            await new Promise(resolve => setTimeout(resolve, Math.min(3000, Math.round(450 * Math.pow(1.45, attempt)))));
          }
          if (!result || result.pending === true) throw new Error('Gateway RPC result timeout');
          if (result.transportOk !== true || !result.result || result.result.ok !== true) {
            throw new Error('Gateway RPC round trip failed: '+JSON.stringify(result && result.error || result));
          }
          console.log('Cloudflare P0-E gateway PASS:', gateway);
          NODE
