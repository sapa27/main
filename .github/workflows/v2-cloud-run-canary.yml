name: V2 Cloud Run Canary

on:
  workflow_dispatch:
  push:
    branches:
      - v2-live-canary-verify-20260920

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: sapa27
  REGION: asia-southeast3
  SERVICE: sapa27-v2-canary
  WIF_PROVIDER: projects/770468331446/locations/global/workloadIdentityPools/github-actions/providers/sapa27-main
  DEPLOY_SERVICE_ACCOUNT: github-cloud-run-deployer@sapa27.iam.gserviceaccount.com
  GAS_WEB_APP_URL: https://script.google.com/macros/s/AKfycbz73ISkoejp_JJOPEC1OfPenrej427rA897CL_-8wsM9oMm1zM-hHUZH3NjYuIfWF-d/exec

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate V2
        run: |
          set -euo pipefail
          node --check frontend-v2/app.js
          node .github/tests/v2-regression.mjs
          rm -rf cloud-run-gateway/public
          cp -R frontend-v2 cloud-run-gateway/public
          cd cloud-run-gateway
          npm run check
          npm test

      - name: Build container in GitHub Actions
        run: |
          docker build -t sapa27-v2:canary cloud-run-gateway

      - name: Diagnose current production deferred Dashboard path
        env:
          PROD_URL: https://sapa27-gateway-asxuzzwspa-eu.a.run.app
        run: |
          node <<'NODE'
          (async()=>{
            const base=process.env.PROD_URL;
            async function rpc(method,payload,timeoutMs=70000){
              const r=await fetch(base+"/api/router",{
                method:"POST",
                headers:{"Content-Type":"application/json","Origin":base,"X-Request-ID":"v2-canary-prod-diag"},
                body:JSON.stringify({method,payload,timeoutMs})
              });
              const text=await r.text();
              let json=null; try{json=JSON.parse(text)}catch{}
              return {status:r.status,contract:r.headers.get("x-gas-response-contract")||"",json,text};
            }
            function summarize(v,depth=0){
              if(v==null)return {type:String(v)};
              if(typeof v==="string")return {type:"string",len:v.length,prefix:v.slice(0,120)};
              if(typeof v!=="object")return {type:typeof v,value:v};
              if(Array.isArray(v))return {type:"array",len:v.length};
              const o={type:"object",keys:Object.keys(v).slice(0,40)};
              for(const k of ["ok","errorCode","code","msg","message","error"]){
                if(Object.prototype.hasOwnProperty.call(v,k)&&typeof v[k]!=="object")o[k]=v[k];
              }
              for(const k of ["data","result","payload"]){
                if(Object.prototype.hasOwnProperty.call(v,k)&&depth<3)o[k]=summarize(v[k],depth+1);
              }
              if(typeof v.html==="string")o.html={len:v.html.length,prefix:v.html.slice(0,80)};
              return o;
            }
            function htmlOf(v,depth=0){
              if(typeof v==="string")return /<script|<style|AppPages\.register|apiGetDashboardBundle/.test(v)?v:"";
              if(!v||typeof v!=="object"||depth>8)return "";
              if(typeof v.html==="string")return v.html;
              for(const k of ["data","result","payload","content","text","value"]){
                if(Object.prototype.hasOwnProperty.call(v,k)){const h=htmlOf(v[k],depth+1);if(h)return h;}
              }
              for(const k of Object.keys(v)){const h=htmlOf(v[k],depth+1);if(h)return h;}
              return "";
            }
            const variants=[
              ["direct-default","getDeferredInclude",{name:"Scripts_Page_Dashboard"}],
              ["direct-false","getDeferredInclude",{name:"Scripts_Page_Dashboard",forceFresh:false}],
              ["direct-stamp","getDeferredInclude",{name:"Scripts_Page_Dashboard",forceFresh:false,assetStamp:"commission-v1.2-reliability-loading-cache-session-2026-09-02-r331-v62"}],
              ["router-default","apiRouter",{method:"getDeferredInclude",payload:{name:"Scripts_Page_Dashboard"}}]
            ];
            let includeReady=false;
            for(const [label,method,payload] of variants){
              const out=await rpc(method,payload);
              const html=htmlOf(out.json&&out.json.result);
              console.log("PROD_DASH_INCLUDE_"+label,JSON.stringify({
                status:out.status,contract:out.contract,transportOk:!!(out.json&&out.json.transportOk),
                envelopeKeys:out.json&&typeof out.json==="object"?Object.keys(out.json):[],
                resultSummary:summarize(out.json&&out.json.result),
                bytes:html.length,
                hasRegister:/AppPages\.register\(["']dashboard["']/.test(html),
                hasBundle:/apiGetDashboardBundle/.test(html)
              }));
              if(out.status===200&&out.contract==="gas-direct-json-v1"&&out.json&&out.json.transportOk===true&&html.length>1000&&/apiGetDashboardBundle/.test(html))includeReady=true;
            }
            const app=await rpc("apiRouter",{method:"apiGetDashboardBundle",payload:{source:"unauth-prod-diag"}},70000);
            console.log("PROD_DASH_ROUTE",JSON.stringify({
              status:app.status,contract:app.contract,transportOk:!!(app.json&&app.json.transportOk),
              resultSummary:summarize(app.json&&app.json.result)
            }));
            if(!includeReady)throw new Error("PROD_DASHBOARD_DEFERRED_INCLUDE_NOT_READY");
            if(app.status!==200||app.contract!=="gas-direct-json-v1"||!app.json||app.json.transportOk!==true)throw new Error("PROD_DASHBOARD_ROUTER_TRANSPORT_NOT_READY");
          })().catch(err=>{console.error("PROD_DIAG_FATAL",err&&err.stack||err);process.exit(1)});
          NODE

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy canary to Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --source cloud-run-gateway \
            --allow-unauthenticated \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 30 \
            --min-instances 0 \
            --max-instances 3 \
            --timeout 300 \
            --set-env-vars "GAS_WEB_APP_URL=$GAS_WEB_APP_URL,APP_SOURCE_SHA=$GITHUB_SHA"

      - name: Smoke test
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          echo "Cloud Run URL: $URL"
          ready="$(curl --max-time 30 -fsS "$URL/ready")"
          health="$(curl --max-time 15 -fsS "$URL/health")"
          upstream="$(curl --max-time 45 -fsS "$URL/upstream-health")"
          node -e 'const r=JSON.parse(process.argv[1]),h=JSON.parse(process.argv[2]),u=JSON.parse(process.argv[3]),sha=process.argv[4];if(r.ok!==true||r.sourceSha!==sha||h.ok!==true||u.ok!==true||u.upstream?.checked!==true||u.upstream?.ok!==true||u.upstream?.transport!=="gas-direct-json")process.exit(1)' "$ready" "$health" "$upstream" "$GITHUB_SHA"
          curl --max-time 30 -fsS "$URL/app.js" | grep -q 'v2-rebuild-20260918'
          echo "Runtime: Browser -> Cloud Run -> GAS Direct JSON" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: $URL" >> "$GITHUB_STEP_SUMMARY"
