name: P2-F Atomic Staging

on:
  push:
    branches: [release/p2f-production]
    paths:
      - '.github/workflows/p2f-stage.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify P2-F patch
        shell: bash
        run: |
          set -euo pipefail
          cat .p2f-payload/part* | base64 -d > /tmp/p2f.patch.xz
          echo "e0ac79560e9d248ebc4165a95ef250b65bdbdd81b40ca36f7b1c5a0f17b01f84  /tmp/p2f.patch.xz" | sha256sum -c -
          xz -dc /tmp/p2f.patch.xz > /tmp/p2f.patch
          git apply --check /tmp/p2f.patch
          git apply /tmp/p2f.patch
          echo "100e6fca6282c616aaeaed91da56272f67c8d1928fa5e0fdda1d7694cbb99a09  .github/tests/regression.mjs" | sha256sum -c -
          echo "cea26b3be8f8500143d844f9fd20257f27a1ffd7dc94e33073c97357d0499e0e  .github/workflows/pages.yml" | sha256sum -c -
          echo "752fd89b8a16130cd294b2c473454b8c61de6fa4bb6aadd87b762de3826f2c91  github-pages/index.html" | sha256sum -c -
          echo "b0f8fcbe7c606a60f635da6c6b5b2d6dc3701fe81c042147e56859492edaa7e1  github-pages/app-critical-runtime.js" | sha256sum -c -
          echo "c35d7c932f3e021f850a4cc524d75b6433faef3a7cd57ba55ddb1f8805d5743a  github-pages/github-gas-transport.js" | sha256sum -c -
          test ! -e github-pages/app-config.js
          node .github/tests/regression.mjs --frontend-only

      - name: Commit exact P2-F release tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .p2f-payload
          rm -f .github/workflows/p2f-stage.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: stage P2-F frontend and CI"
          git push origin HEAD:release/p2f-production
