name: V2 Clean Frontend Canary
on:
  push:
    paths:
      - 'frontend-v2/**'
      - 'cloud-run-gateway/**'
      - '.github/tests/v2-regression.mjs'
      - '.github/workflows/v2-canary.yml'
      - '.github/workflows/v2-cloud-run-canary.yml'
      - '.github/workflows/v2-promote-production.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy V2 clean frontend canary'
        required: true
        type: boolean
        default: true

concurrency:
  group: v2-clean-canary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate V2 deterministic runtime
        run: |
          set -euo pipefail
          node --check frontend-v2/app.js
          node .github/tests/v2-regression.mjs
          test -f frontend-v2/index.html
          test -f frontend-v2/styles.css
          grep -q 'V2 CLEAN' frontend-v2/index.html || true
          grep -q 'meeting:{title:"จัดการเรื่องพิจารณา",render:routeMeeting}' frontend-v2/app.js
          ! grep -Eq 'getDeferredInclude|loadPageScripts|pageController|meetingPageScriptLoadTimeout' frontend-v2/app.js
          for route in dashboard search meeting report track committee-meeting people petitioner budget admin; do
            grep -q "$route" frontend-v2/app.js
          done
      - name: Stage V2 into gateway image
        run: |
          rm -rf cloud-run-gateway/public
          cp -R frontend-v2 cloud-run-gateway/public
          test -f cloud-run-gateway/public/index.html
          test -f cloud-run-gateway/public/app.js
          test -f cloud-run-gateway/public/styles.css
      - name: Validate gateway
        run: |
          cd cloud-run-gateway
          npm run check
          npm test
      - name: Validate container
        run: docker build --file cloud-run-gateway/Dockerfile cloud-run-gateway

  deploy:
    needs: validate
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-v2]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'sapa27' }}
      REGION: ${{ vars.GCP_REGION || 'asia-southeast3' }}
      SERVICE: sapa27-v2-canary
      WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || 'projects/770468331446/locations/global/workloadIdentityPools/github-actions/providers/sapa27-main' }}
      DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT || 'github-cloud-run-deployer@sapa27.iam.gserviceaccount.com' }}
      GAS_WEB_APP_URL: https://script.google.com/macros/s/AKfycbwqSbRql8u8qM_HiHcmYLiIVG-tCsqQtZGBNLAor-A0phnsstDm81_tjwnjJENXtZHT/exec
    steps:
      - uses: actions/checkout@v4
      - name: Stage V2
        run: |
          rm -rf cloud-run-gateway/public
          cp -R frontend-v2 cloud-run-gateway/public
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
      - name: Deploy isolated V2 canary
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE"             --project "$PROJECT_ID" --region "$REGION"             --source cloud-run-gateway --allow-unauthenticated             --cpu 1 --memory 512Mi --concurrency 30             --min-instances 0 --max-instances 3 --timeout 300             --set-env-vars "GAS_WEB_APP_URL=$GAS_WEB_APP_URL,APP_SOURCE_SHA=$GITHUB_SHA"
          url="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          echo "V2_URL=$url" >> "$GITHUB_ENV"
      - name: Smoke V2 static/runtime boundary
        run: |
          set -euo pipefail
          ready="$(curl --max-time 30 -fsS "$V2_URL/ready")"
          health="$(curl --max-time 15 -fsS "$V2_URL/health")"
          upstream="$(curl --max-time 45 -fsS "$V2_URL/upstream-health")"
          echo "V2 ready: $ready"
          echo "V2 health: $health"
          echo "V2 upstream: $upstream"
          node -e 'const r=JSON.parse(process.argv[1]),h=JSON.parse(process.argv[2]),u=JSON.parse(process.argv[3]),sha=process.argv[4];if(r.ok!==true||r.sourceSha!==sha||h.ok!==true||u.ok!==true||u.upstream?.checked!==true||u.upstream?.ok!==true||u.upstream?.transport!=="gas-direct-json")process.exit(1)' "$ready" "$health" "$upstream" "$GITHUB_SHA"
          tmp_dir="$(mktemp -d)"
          curl --max-time 30 -fsS "$V2_URL/" -o "$tmp_dir/index.html"
          curl --max-time 30 -fsS "$V2_URL/app.js" -o "$tmp_dir/app.js"
          grep -q 'Clean Runtime V2' "$tmp_dir/index.html"
          grep -q 'v2-rebuild-20260918' "$tmp_dir/app.js"
          grep -q 'meeting:{title:"จัดการเรื่องพิจารณา",render:routeMeeting}' "$tmp_dir/app.js"
          if grep -Eq 'getDeferredInclude|loadPageScripts|pageController|meetingPageScriptLoadTimeout' "$tmp_dir/app.js"; then
            echo "Legacy loader dependency detected" >&2
            exit 1
          fi
          echo "### V2 Clean Canary" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $V2_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- Runtime: Browser → Cloud Run → GAS only" >> "$GITHUB_STEP_SUMMARY"
          echo "- GitHub runtime dependency: none" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deferred page loader: removed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Meeting controller: static route registry" >> "$GITHUB_STEP_SUMMARY"
